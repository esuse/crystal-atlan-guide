 {id:'cur_gift',name:'Подарочные карты',who:'Обмен → Подарочные карты',must:['Только раскраски транспорта','Каждая даёт уровни коллекции транспорта','Карты - из «Желаний»'],
  steps:[S('x_cur_gift','Что это','Универсальная подарочная карта. Получаешь, загадывая <b>желания</b> в категории «Транспорт и скакуны».'),
   S('x_gift','Что купить','Раскраски ховербайков и роверов (1-2 карты). После активации каждая даёт 1-2 уровня <b>коллекции транспорта</b> - а коллекция даёт статы и учитывается даже в Арканитовом лабиринте.')]}]},
{id:'nexus',tab:'Нексум',title:'Нексум: лабиринты',
 chips:['с 60 ур.','сброс чт 06:00 UTC','цикл 12 недель','соло и группа 2-4'],
 lead:'Нексум - режим-рогалик: проходишь залы, собираешь усиления на один поход и бьёшь финального босса. Каждую неделю даёт пыль эпох (обмен на катализаторы, гравировки, карты колод) и кристаллы Нексума (постоянные таланты). Скрижали, связки, артефакты и синтез вынесены в отдельные вкладки.',
 bosses:[
 {id:'nx_enter',name:'Как зайти и что выбрать',who:'Tab → Сражения → Нексум',must:['Вход стоит 5 зеркальных призм','8 сложностей, открываются по очереди','Сложность не выше своей боеготовности'],
  steps:[S('n_main','Окно Нексума','Слева <b>аномалия недели</b> (особые правила, меняются каждый четверг), снизу выбор <b>Группа / Один игрок</b> и <b>сложность I-VIII</b>. В центре финальный босс и награды: «Первый раз» и «Всегда». Справа <b>Обмен, Прогресс, Атлас, Рейтинг</b>. Внизу ключи от ларцов недели (6 штук на учётку).'),
   S('n_rules1','Два режима','<b>Лабиринты Нексума</b> - соло, вход 5 зеркальных призм. <b>Лабиринты отражений</b> - группа 2-4 игрока, тоже 5 призм; порталы, события и артефакты выбирает лидер группы. Сложности открываются по очереди, в любом из режимов. На каждой из 8 сложностей свой финальный босс; в начале цикла открыта только первая.'),
   S(null,'Боеготовность','Если выбрать сложность <b>выше своей боеготовности</b>, урон по врагам режется - поход почти наверняка провалится. Боеготовность поднимает талант «Идеальная боеготовность» во вкладке «Прогресс».','w')]},
 {id:'nx_run',name:'Что происходит внутри похода',who:'механики, которых нет в обычных инстансах',must:['Обычные зелья не работают - только тинктура','3 воскрешения на старте','Всё, что собрал в походе, сгорает в конце'],
  steps:[S(null,'Тинктура вместо зелий','Восстановить здоровье можно только <b>тинктурой</b>: 3 порции, пополняются после каждого зала с боссом, но есть способы увеличить их число. Свойства тинктуры зависят от <b>реагентов</b> (выпадают в бою и продаются у торговцев); уровень тинктуры = сумма уровней реагентов.'),
   S(null,'Проводник и скрижали','В начале каждой экспедиции выбираешь <b>проводника</b> (таинственную тень героя): он награждает дополнительными способностями и задаёт стиль игры. В наградах чаще всего выбор <b>1 из 3 скрижалей</b>: они улучшают и уточняют способности проводников или классовые умения героя и обнуляются в конце экспедиции. <b>Тайнопись</b> - особая цветная строка внизу скрижали; «Предчувствие тайны» гарантирует тайнопись на следующей.'),
   S(null,'Артефакты, проклятия, торговцы','<b>Артефакты</b> дают полезные эффекты, в группе - сразу всем. <b>Проклятия</b> тоже действуют на всю группу. <b>Осколки эпох</b> - валюта для торговцев внутри лабиринта, у них же покупаются воскрешения и реагенты. Некоторые артефакты дают скидку до 20%.'),
   S(null,'Свои статы в Нексуме','Враги устойчивы к крит. урону. Внутри считаются отдельные показатели: <b>сила атаки в Нексуме, бонус к урону в Нексуме, устойчивость к урону в Нексуме</b> - их поднимают таланты «Прогресса».'),
   S(null,'Сохранение','В соло можно сохранить прогресс после зала и временно выйти из Нексума: продолжить предложат при следующем входе. Новый поход удаляет старое сохранение, так же оно удаляется утром четверга при обновлении лабиринта. Осколки, скрижали и артефакты обнуляются в конце каждого похода.','w')]},
 {id:'nx_rew',name:'Награды и обмен',who:'Нексум → Обмен',must:['Ларцы недели: 9-й зал - 1, 14-й - 2, 16-й - 3','Пыль в ларце: 90 на I … 350 на VIII','Меняй пыль на катализаторы и гравировку'],
  steps:[S(null,'Еженедельные ларцы','За неделю на учётку: <b>1 ларец</b> за битву в 9-м зале, <b>2</b> - за 14-й, <b>3</b> - за 16-й. В ларце пыль эпох: от 90 горстей на сложности I до 350 на VIII. Каждую неделю дают 6 ключей. Забыл открыть: перед четвергом игра откроет их сама, а награду пришлёт по почте персонажу, который сейчас в игре, или тому, у кого самый высокий рейтинг. «Первый раз» даётся один раз на учётку, после того как пройдёшь Нексум любым персонажем.'),
   S('n_shop_1','Обмен пыли эпох: что брать','Лимиты - на учётку за сезон. В приоритете: <b>Мощный катализатор 800</b> (3), <b>Стандартный катализатор 100</b> (8), <b>Набор клише для гравировок II 1500</b> (3), <b>Гравировка «Тарина» I 1500</b>, Арканитовый медальон 200 (5). Наборы «Морозный гимн» - карты колод «Гильдия маготехников» и «Дикая орда».'),
   S('n_shop_3','Дальше по списку','<b>Кошель 100 000 золотых за 100</b> (30 штук) - так лишняя пыль превращается в золото. Новые наборы «Морозный гимн» открываются, когда накопишь 6000 / 9000 / 12000 пыли за сезон.','s','Порядок: катализаторы → клише и гравировка → кошели с золотом на остаток.'),
   S(null,'Награды за исследование и рейтинг','Залы и враги дают <b>очки исследования</b> (выше сложность - больше), за них открываются награды. Очки и награды обнуляются каждый цикл, и каждая награда даётся один раз на учётку за цикл. <b>Рейтинг</b> - только соло в «Лабиринтах Нексума», бывает серверный и межсерверный: считается сложность, потом число залов, потом время зачистки залов с боссами. У каждого класса свой рейтинг, смена класса удаляет результат. Подсчёт по четвергам в 06:00 UTC: награда одна на учётку, по лучшему результату, потом рейтинг обнуляется.'),
   S(null,'Обнуление цикла','Каждые 12 недель Нексум начинает новый цикл: сложность сбрасывается до первой, награды за исследование обнуляются, аномалии меняются.')]},
 {id:'nx_prog',name:'Прогресс: постоянные таланты',who:'Нексум → Прогресс',must:['Кристаллы Нексума общие на учётку','Лимит кристаллов растёт с неделей сезона','Таланты можно сбросить и перераспределить'],
  steps:[S('n_prog1','Вкладка талантов','<b>Идеальная боеготовность</b> (+боеготовность), <b>Непрерывный штурм</b> (прорыв защиты и сила атаки в Нексуме), <b>Звон монет</b> (больше осколков эпох, шанс крита), <b>Улыбка фортуны</b> (шанс улучшенной скрижали и тайнописи). Справа пассивки, открываются по <b>общей сложности</b>. Кнопка «Сбросить» возвращает кристаллы.'),
   S(null,'Сколько кристаллов за неделю',T([['Неделя сезона','Скорость','Лимит'],['1','100%','1000'],['2','140%','2400'],['3','180%','4200'],['4','240%','6600'],['5','300%','9600'],['6','360%','13200'],['7','480%','18000'],['8-12','600%','24000']])+'<p>Плюс каждую неделю при первом входе персонаж сам получает порцию кристаллов.</p>'),
   S('n_prog2','Вкладка «Глубины»','2 слота под пассивки похода. <b>Знаток лабиринта</b> позволяет получить 2 случайные скрижали вместо выбора одной из трёх. <b>Библиотекарь</b> повышает шанс улучшенной скрижали на 20%; <b>Козырная карта</b> даёт 20% шанс удвоить количество скрижалей в награде за зал. Полный разбор перков и их сочетаний - во вкладке «Что собирать».','s'),
   S('n_atlas','Атлас Нексума','Коллекция открытых <b>проводников, скрижалей и артефактов</b>. Тут удобно читать, что делает каждая находка, до похода.')]}]},
{id:'nx_tab',tab:'Скрижали',title:'Нексум: скрижали проводников',
 chips:['7 проводников + «Свой путь»','цвета: топ, средние, базовые','«до → после улучшения»'],
 lead:'Описания короткие: «что было → что стало после улучшения». Подробный текст каждой скрижали есть в игре: <b>Нексум → Атлас → Скрижали</b>. Названия подсвечены цветом редкости.',
 bosses:[
 {id:'tgh',name:'Как это работает',who:'награды и выпадение',must:['В трофеях 3 скрижали от разных проводников','Бери новые, пока не откроешь все','Награды за число открытых скрижалей'],
  steps:[
   S('nx_rewards','Награды коллекции','Рядом со счётчиком «Открыто» в окнах «Скрижали» и «Проводники» есть кнопка с подарком: награды коллекции. <b>Скрижали</b> (всего 140): на 15 открытых 60 000 золота, на 30 открытых 80 000, на 45 открытых 100 000, дальше больше. <b>Проводники</b> (всего 21): каждые 3 открытых, на 3 это 60 000 золота, на 6 80 000, на 9 100 000, на 12 120 000, на 15 140 000, на 18 160 000. К золоту идут ресурсы и предметы. Скрижаль открывается, когда ты впервые её получил в походе, поэтому на первых проходах бери <b>все новые скрижали</b> и каждый раз играй <b>новым проводником</b>.'),
   S(null,'Как выпадают скрижали в походе','В трофеях зала предлагают <b>3 скрижали</b> от <b>разных проводников</b>, не только от выбранного. Выбираешь одну. «Сбросить» заменяет набор (20 кристаллов, 3 попытки). Кнопка «Случайно» есть не всегда: она появляется при перке из «Прогресс → Глубины». Выбранный проводник лишь повышает шанс скрижалей своей группы (через его «Судьбу»), поэтому ниже у каждого проводника перечислены все его скрижали.'),
  ]},
 {id:'tg0',col:'#e0a92e',name:'Монарх',who:'20 скрижалей',must:['Чистый урон по боссу в резонансе. Нужно держать резонанс и копить его энергию.','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Монарха</b><span>шанс получить скрижали Монарха выше; в резонансе сила атаки +5% и ещё +1% за каждую скрижаль Монарха.</span></div><div class="tb t-o"><b class="tn">Непоколебимый владыка</b><span>в резонансе урон и устойчивость +20%; после улучшения растёт за каждую скрижаль Монарха (до x5).</span></div><div class="tb t-o"><b class="tn">Подавляющее величие</b><span>урон «Величия» +3% за срабатывание (до 100 раз) → +6%.</span></div><div class="tb t-o"><b class="tn">Истинный сюзерен</b><span>«Величие» при входе в резонанс держится 30% его времени → 45%.</span></div>'),
   S(null,'🟪 Фиолетовые, средние (7)','<div class="tb t-p"><b class="tn">Долгий резонанс</b><span>резонанс длится на 60% дольше → на 100%.</span></div><div class="tb t-p"><b class="tn">Да здравствует король</b><span>сила атаки +80 за 1% здоровья (до 8000) → +110 (до 11000).</span></div><div class="tb t-p"><b class="tn">Правое дело</b><span>убийство даёт 1000 энергии резонанса → ещё и 10% здоровья.</span></div><div class="tb t-p"><b class="tn">Тайный ингредиент</b><span>после тинктуры урон «Величия» +40% на 5 сек. → +70%.</span></div><div class="tb t-p"><b class="tn">Королевский размах</b><span>радиус «Величия» +25% → +50%.</span></div><div class="tb t-p"><b class="tn">Священный поход</b><span>в резонансе сила атаки +5000 и скорость +20% → +8500 и +40%.</span></div><div class="tb t-p"><b class="tn">Взгляд владыки</b><span>«Величие» при входе в резонанс 5 сек. → 8 сек.</span></div>'),
   S(null,'🟦 Синие, базовые (9)','<div class="tb t-b"><b class="tn">Озарение Монарха</b><span>за уровень Озарения сила атаки +1400 → +2800.</span></div><div class="tb t-b"><b class="tn">Наперекор судьбе</b><span>сила атаки +2800 и +1400 за каждое проклятие → +5200 и +2600.</span></div><div class="tb t-b"><b class="tn">На марше</b><span>портал даёт 10000 энергии резонанса → полную шкалу.</span></div><div class="tb t-b"><b class="tn">Верная гвардия</b><span>при щите +2000 энергии резонанса каждые 2 сек. → +4000.</span></div><div class="tb t-b"><b class="tn">Король-алхимик</b><span>урон в резонансе +2,5% за уровень тинктуры → +5%.</span></div><div class="tb t-b"><b class="tn">Победоносный натиск</b><span>в резонансе сила атаки +500 в секунду (до 10000) → +1000 (до 20000).</span></div><div class="tb t-b"><b class="tn">Медитация</b><span>энергия резонанса восстанавливается быстрее на 40% → 80%.</span></div><div class="tb t-b"><b class="tn">Король-солнце</b><span>вход в резонанс включает «Ослепительное величие» → ещё +20% к его урону.</span></div><div class="tb t-b"><b class="tn">Привилегия владыки</b><span>максимум энергии резонанса +1 деление → +2.</span></div>'),
  ]},
 {id:'tg1',col:'#38bdf8',name:'Звёздочёт',who:'20 скрижалей',must:['Живучесть и урон от щита. Подходит тем, кто собирает защиту.','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Звездочета</b><span>каждые 25 сек. щит 5000 и уровень «Звёздного света»; интервал короче за каждую скрижаль Звездочета.</span></div><div class="tb t-o"><b class="tn">Эволюция</b><span>умение даёт +2 к «Звёздному свету», на 10-м срабатывает «Взрыв сверхновой» → +80% к его урону.</span></div><div class="tb t-o"><b class="tn">Гороскоп</b><span>после урона эффект «Под счастливой звездой» 7 сек.; перезарядка 45 → 20 сек.</span></div><div class="tb t-o"><b class="tn">Нейтронная звезда</b><span>при щите защита +20% → вместо этого снижение истинного урона +20%.</span></div>'),
   S(null,'🟪 Фиолетовые, средние (7)','<div class="tb t-p"><b class="tn">Созвездие Гончих псов</b><span>умение питомца даёт +4 к «Звёздному свету» → +8.</span></div><div class="tb t-p"><b class="tn">Пульсар</b><span>«Взрыв сверхновой» сам каждые 20 сек. → каждые 10.</span></div><div class="tb t-p"><b class="tn">Гало</b><span>после сверхспособности щит на 10 сек. отражает дальний бой → перенаправляет атаки на вас.</span></div><div class="tb t-p"><b class="tn">Северный Крест</b><span>при щите урон +12% → +21%.</span></div><div class="tb t-p"><b class="tn">Планетарные кольца</b><span>за 4 умения щит (защита x2) → x4, до 5 раз.</span></div><div class="tb t-p"><b class="tn">Созвездие Скорпиона</b><span>после урона защита +20% на 10 сек. → +40%, до 3 раз.</span></div><div class="tb t-p"><b class="tn">Затмение</b><span>за прочность щита 10% здоровья урон +1,5% (до 15%) → +2,5% (до 25%).</span></div>'),
   S(null,'🟦 Синие, базовые (9)','<div class="tb t-b"><b class="tn">Озарение Звездочета</b><span>за уровень Озарения урон +3% → +6%.</span></div><div class="tb t-b"><b class="tn">Сияние звезд</b><span>«Звёздный свет» +1 каждые 2 сек. → каждую секунду.</span></div><div class="tb t-b"><b class="tn">Созвездие Льва</b><span>за 400 защиты урон +1% (до 10%) → +2% (до 20%).</span></div><div class="tb t-b"><b class="tn">Под знаком щита</b><span>при входе в резонанс щит (защита x2) → x4, до 5 раз.</span></div><div class="tb t-b"><b class="tn">Пояс астероидов</b><span>после сверхспособности щит (защита x2) → x4.</span></div><div class="tb t-b"><b class="tn">Созвездие Алхимика</b><span>за уровень тинктуры защита и сопротивление +100 → +200.</span></div><div class="tb t-b"><b class="tn">Изумрудные звезды</b><span>после тинктуры щит (защита x2) → x4.</span></div><div class="tb t-b"><b class="tn">Первопроходец</b><span>при входе в зал щит вам и союзникам (защита x2) → x4.</span></div><div class="tb t-b"><b class="tn">Созвездие Черепахи</b><span>при щите враги целят в вас, защита +20% → +50%.</span></div>'),
  ]},
 {id:'tg2',col:'#ef4444',name:'Мечник',who:'20 скрижалей',must:['Мобильный урон: скорость, уклонения, «Стена клинков».','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Мечника</b><span>уровень «Неуловимого мстителя» +1 каждые 12 сек. (короче за скрижали Мечника); на 4 уровне «Стена клинков» бьёт рядом.</span></div><div class="tb t-o"><b class="tn">Танец с клинками</b><span>урон «Стены клинков» растёт от скорости до 1500% → до 3000%.</span></div><div class="tb t-o"><b class="tn">Идеальная брешь</b><span>сломан щит босса: сверхспособность готова (раз в 40 сек.) → готовы все умения.</span></div><div class="tb t-o"><b class="tn">Уход в тень</b><span>при уроне теряешь только один уровень «Мстителя» → не теряешь вовсе.</span></div>'),
   S(null,'🟪 Фиолетовые, средние (7)','<div class="tb t-p"><b class="tn">Смертельная эффективность</b><span>+1 уровень «Мстителя» за 80 комбо → за 60.</span></div><div class="tb t-p"><b class="tn">Вестник рока</b><span>за уровень «Мстителя» сила атаки +2% → +4%.</span></div><div class="tb t-p"><b class="tn">Поступательное движение</b><span>скорость +3% за зал с боссом → +5%.</span></div><div class="tb t-p"><b class="tn">Шаг сквозь тень</b><span>«Размытый силуэт» +1 каждые 20 сек. → 12 сек.; уклонение даёт рывок и уровень «Мстителя».</span></div><div class="tb t-p"><b class="tn">Закаленный воин</b><span>сила атаки +1500 за посещённый зал битвы → +2500.</span></div><div class="tb t-p"><b class="tn">Пируэт</b><span>+1 попытка уклонения → +2.</span></div><div class="tb t-p"><b class="tn">Танцующий шаг</b><span>уклонение с шансом 25% даёт «Размытый силуэт» → 50%.</span></div>'),
   S(null,'🟦 Синие, базовые (9)','<div class="tb t-b"><b class="tn">Озарение Мечника</b><span>за уровень Озарения сила атаки +1400 → +2800.</span></div><div class="tb t-b"><b class="tn">Мощные клинки</b><span>удар «Стены клинков» пробивает щит 8 раз → 15.</span></div><div class="tb t-b"><b class="tn">Второе дыхание</b><span>исцеление с шансом 50% возвращает уклонение → 100%.</span></div><div class="tb t-b"><b class="tn">Длань отмщения</b><span>вход в резонанс даёт +1 уровень «Мстителя» → +2.</span></div><div class="tb t-b"><b class="tn">Блуждающие клинки</b><span>за +10% к скорости скорость ударов «Стены клинков» +15% → +30%.</span></div><div class="tb t-b"><b class="tn">Смертельный расчет</b><span>сжигаешь осколки эпох: сила атаки +3000 за 100 осколков (до 9000) → +6000 (до 18000).</span></div><div class="tb t-b"><b class="tn">Пронзающие лезвия</b><span>шанс крита +7% → +13%.</span></div><div class="tb t-b"><b class="tn">Маскировка</b><span>за уровень «Мстителя» сила атаки +900 → +1700.</span></div><div class="tb t-b"><b class="tn">Подвижность</b><span>уклонение с шансом 25% бесплатно → 50%.</span></div>'),
  ]},
 {id:'tg3',col:'#4ade80',name:'Сновидец',who:'20 скрижалей',must:['Лечение и поддержка: урон и польза растут с эффектом «Изобилие».','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Сновидца</b><span>«Изобилие» 3 уровня, лечение 5% здоровья каждые 5 сек. себе и союзникам; растёт за скрижали Сновидца.</span></div><div class="tb t-o"><b class="tn">Целебный родник</b><span>после сверхспособности источник исцеления на 10 сек.; союзникам бонус к урону 1% за уровень «Изобилия» → 1,5%.</span></div><div class="tb t-o"><b class="tn">Нескончаемый кошмар</b><span>каждые 5 сек. волна кошмаров, урон от «Изобилия» → на 50% сильнее.</span></div><div class="tb t-o"><b class="tn">Сон в летнюю ночь</b><span>за вами цветочная тропа с «Регенерацией» → ещё +20% к элементальному урону.</span></div>'),
   S(null,'🟪 Фиолетовые, средние (6)','<div class="tb t-p"><b class="tn">На пике сил</b><span>при «Железном здоровье» откат сверхспособностей -1 сек. в секунду → -2.</span></div><div class="tb t-p"><b class="tn">Рог изобилия</b><span>урон +12% (и ещё +12% при «Изобилии» выше 14) → +19%.</span></div><div class="tb t-p"><b class="tn">Цветение</b><span>умение с шансом 40% лечит 5% потерянного здоровья → 80%.</span></div><div class="tb t-p"><b class="tn">Чудесная греза</b><span>каждые 60 сек. союзник не умирает и восстанавливается до 50%; улучшенная быстрее восстанавливается от «Изобилия».</span></div><div class="tb t-p"><b class="tn">Двойное изобилие</b><span>вход в резонанс даёт +2 временных уровня «Изобилия» (до 6) → +4 (до 12).</span></div><div class="tb t-p"><b class="tn">Жизнецвет</b><span>после тинктуры лечение +40% на 10 сек. → +60% и «Регенерация».</span></div>'),
   S(null,'🟦 Синие, базовые (10)','<div class="tb t-b"><b class="tn">Жажда жизни</b><span>при «Железном здоровье» +1 уровень «Изобилия» за 8 сек. (до 15) → за 4 сек. (до 30).</span></div><div class="tb t-b"><b class="tn">Озарение Сновидца</b><span>за уровень Озарения урон +3% → +6%.</span></div><div class="tb t-b"><b class="tn">Идеальный баланс</b><span>урон растёт на величину бонуса к лечению → удвоенного.</span></div><div class="tb t-b"><b class="tn">Избыток сил</b><span>при «Изобилии» выше 4 лечение +15% → +30%.</span></div><div class="tb t-b"><b class="tn">Шипы и розы</b><span>каждые 2 сек. теряешь 10% здоровья, шанс 20% получить уровень «Изобилия» → 50%.</span></div><div class="tb t-b"><b class="tn">Сродство с природой</b><span>умение питомца лечит союзников на 30% → ещё и «Регенерация».</span></div><div class="tb t-b"><b class="tn">Омоложение</b><span>лечение 2% здоровья каждые 2 сек. → 4%.</span></div><div class="tb t-b"><b class="tn">Мощь Сновидца</b><span>урон способностей проводника +1% за уровень «Изобилия» → +2%.</span></div><div class="tb t-b"><b class="tn">Железная кожа</b><span>при «Железном здоровье» урон +10% → +20%.</span></div><div class="tb t-b"><b class="tn">Полная чаша</b><span>за уровень тинктуры лечение +1,5% (до 37,5%) → +3% (до 75%).</span></div>'),
  ]},
 {id:'tg4',col:'#f97316',name:'Фанатик',who:'20 скрижалей',must:['Урон стихиями по площади и частые перезарядки.','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Фанатика</b><span>умение с шансом 10% (+5% за скрижаль Фанатика) даёт +10 к «Экзальтации».</span></div><div class="tb t-o"><b class="tn">Гексаграмма</b><span>элементальный урон +18% → +30%.</span></div><div class="tb t-o"><b class="tn">Эхо стихий</b><span>способности стихий повторяются сразу с шансом 25% → 50%.</span></div><div class="tb t-o"><b class="tn">Исступление</b><span>каждое умение +25 к «Экзальтации» → +30 и +30% к урону «Стихийного бедствия».</span></div>'),
   S(null,'🟪 Фиолетовые, средние (7)','<div class="tb t-p"><b class="tn">Аффект</b><span>«Экзальтация» +3 в секунду → +6.</span></div><div class="tb t-p"><b class="tn">Гибкий разум</b><span>после уклонения элементальный урон +10% на 5 сек. → +18%.</span></div><div class="tb t-p"><b class="tn">Призыв теней</b><span>шанс печати измерений +3% → +5%.</span></div><div class="tb t-p"><b class="tn">Печать астрала</b><span>обычное умение с шансом 12,5% создаёт чёрную дыру → +30% к урону чёрных дыр.</span></div><div class="tb t-p"><b class="tn">Печать льда</b><span>сверхспособность обрушивает ледяную глыбу → +30% к урону глыб.</span></div><div class="tb t-p"><b class="tn">Темпоральная печать</b><span>«Стихийное бедствие» сокращает откаты умений на 1 сек. → 2.</span></div><div class="tb t-p"><b class="tn">Сродство с элементами</b><span>«Стихийное бедствие» накладывает доп. эффекты, его урон +9% → +16%.</span></div>'),
   S(null,'🟦 Синие, базовые (9)','<div class="tb t-b"><b class="tn">Озарение Фанатика</b><span>за уровень Озарения сила атаки +1400 → +2800.</span></div><div class="tb t-b"><b class="tn">Упоение битвой</b><span>базовая атака даёт +2 к «Экзальтации» → +3.</span></div><div class="tb t-b"><b class="tn">Печать огня</b><span>умение питомца обрушивает ревущее пламя → +30% к его урону.</span></div><div class="tb t-b"><b class="tn">Печать молний</b><span>базовая атака с шансом 10% зовёт цепную молнию (7 целей) → шанс 20%, урон +30%.</span></div><div class="tb t-b"><b class="tn">Быстрые заклинания</b><span>откат всех умений -1 сек. каждые 15 сек. → -2.</span></div><div class="tb t-b"><b class="tn">Оберег стихий</b><span>«Стихийное бедствие» лечит 10% здоровья → 20%.</span></div><div class="tb t-b"><b class="tn">Торжество стихий</b><span>за 1000 силы атаки урон «Стихийного бедствия» +1,6% (до 160%) → +3% (до 300%).</span></div><div class="tb t-b"><b class="tn">Скрижали силы</b><span>шанс улучшения скрижали +5% → +10%.</span></div><div class="tb t-b"><b class="tn">Экстаз</b><span>после исцеления «Экзальтация» +10 → +20.</span></div>'),
  ]},
 {id:'tg5',col:'#facc15',name:'Негоциант',who:'20 скрижалей',must:['Осколки эпох и тинктура: сила растёт от накопленного.','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Негоцианта</b><span>новый реагент «Средоточие эпох»; с ним тинктура обрушивает «Град осколков эпох».</span></div><div class="tb t-o"><b class="tn">Ловкость рук</b><span>пожертвованные осколки возвращаются с шансом 15% → 22%.</span></div><div class="tb t-o"><b class="tn">Экономист</b><span>тинктур на 1 больше, вход в зал возвращает одну, 15% не тратится → на 2 больше, 25%.</span></div><div class="tb t-o"><b class="tn">Бездонный кошелек</b><span>«Град осколков эпох» сам каждые 50 сек. → 30 сек.</span></div>'),
   S(null,'🟪 Фиолетовые, средние (7)','<div class="tb t-p"><b class="tn">Последний шанс</b><span>после последней тинктуры урон +60% на 10 сек. → +100% на 15 сек.</span></div><div class="tb t-p"><b class="tn">Прибыльная экспедиция</b><span>осколков эпох на 10% больше → ещё 70 сразу.</span></div><div class="tb t-p"><b class="tn">Пошлина</b><span>вход в новый зал даёт 10 осколков → 17.</span></div><div class="tb t-p"><b class="tn">Выгодные сделки</b><span>товары у торговцев дешевле на 6% → 10%.</span></div><div class="tb t-p"><b class="tn">Сделка со смертью</b><span>на грани смерти за 50 осколков здоровье до 50% → за 25 осколков до 80% (раз в зал).</span></div><div class="tb t-p"><b class="tn">Удачная ставка</b><span>после победы шанс 1% удвоить осколки (до 300) → 5% (до 500).</span></div><div class="tb t-p"><b class="tn">Сила в деньгах</b><span>урон +10% за 200 осколков (до 5 раз) → за 100 осколков.</span></div>'),
   S(null,'🟦 Синие, базовые (9)','<div class="tb t-b"><b class="tn">Озарение Негоцианта</b><span>за уровень Озарения сила атаки +1400 → +2800.</span></div><div class="tb t-b"><b class="tn">Теневая торговля</b><span>тинктур на 1 больше → ещё +5 к максимальному уровню.</span></div><div class="tb t-b"><b class="tn">Капитал</b><span>за 500 осколков за экспедицию сила атаки +7000 → растёт дальше с каждыми 250.</span></div><div class="tb t-b"><b class="tn">Под процент</b><span>за каждые 250 осколков шанс крита +2% (до 10%).</span></div><div class="tb t-b"><b class="tn">Плата за риск</b><span>вход в опасный зал даёт 20 осколков → 36.</span></div><div class="tb t-b"><b class="tn">Наемный телохранитель</b><span>при входе с 400+ осколками щит равен здоровью → вдвое больше.</span></div><div class="tb t-b"><b class="tn">Ставки растут</b><span>«Град осколков эпох» усиливается на 25% (до 3 раз) → на 50%.</span></div><div class="tb t-b"><b class="tn">Выгодный обмен</b><span>жертвуешь 50% осколков (до 500), за каждые 50 урон +5% → +8%.</span></div><div class="tb t-b"><b class="tn">Тайная связь</b><span>за уровень тинктуры сила атаки +400 (до 10000) → +800 (до 20000).</span></div>'),
  ]},
 {id:'tg6',col:'#a78bfa',name:'Отшельница',who:'20 скрижалей',must:['Хаотичный урон и контроль, рискованный стиль для опытных.','Порядок: оранжевые, фиолетовые, потом синие'],
  steps:[
   S(null,'🟧 Оранжевые, топ (4)','<div class="tb t-o"><b class="tn">Судьба Отшельницы</b><span>«Флуктуация» растёт каждую секунду на случайное число от 1 до числа скрижалей Отшельницы.</span></div><div class="tb t-o"><b class="tn">Сверхпамять</b><span>при входе в зал «Ментальная нить» опутывает ячейку сверхспособности → и каждые 60 сек.</span></div><div class="tb t-o"><b class="tn">Паутина разума</b><span>умение под нитью наносит +100% урона → +150%.</span></div><div class="tb t-o"><b class="tn">Абсолютный хаос</b><span>разброс урона +30% → +50%.</span></div>'),
   S(null,'🟪 Фиолетовые, средние (7)','<div class="tb t-p"><b class="tn">Нейронная сеть</b><span>«Флуктуация» может накладывать нить на сверхспособности → так работает сама нить.</span></div><div class="tb t-p"><b class="tn">Дежа вю</b><span>опутанное умение с шансом 15% опутывается заново → 25%.</span></div><div class="tb t-p"><b class="tn">Дезориентация</b><span>каждый уровень «Флуктуации» повышает разброс урона на 1% → 1,5%.</span></div><div class="tb t-p"><b class="tn">Стабилизация</b><span>нижняя планка разброса 40% от максимума → 70%.</span></div><div class="tb t-p"><b class="tn">Нервные импульсы</b><span>при срабатывании нити урон +3% (до 5 раз) → +6%.</span></div><div class="tb t-p"><b class="tn">Помешательство</b><span>сверхспособность даёт +50 к «Флуктуации» → +80.</span></div><div class="tb t-p"><b class="tn">Ментальные нити</b><span>каждые 40 сек. нить на случайное умение → 25 сек.</span></div>'),
   S(null,'🟦 Синие, базовые (9)','<div class="tb t-b"><b class="tn">Озарение Отшельницы</b><span>за уровень Озарения урон +3% → +6%.</span></div><div class="tb t-b"><b class="tn">Эйфория</b><span>«Флуктуация» 100 заполняет шкалу резонанса на 1 деление → на 2.</span></div><div class="tb t-b"><b class="tn">Исцеление разума</b><span>при «Флуктуации» 100 лечит 1-30% здоровья → 1-60%.</span></div><div class="tb t-b"><b class="tn">Ментальный щит</b><span>при нити щит 15% здоровья (до 5 раз) → 30%.</span></div><div class="tb t-b"><b class="tn">Припадки безумия</b><span>за уровень «Флуктуации» урон +0,2% → +0,4%.</span></div><div class="tb t-b"><b class="tn">Ментальная связь</b><span>убийство с шансом 20% запускает нить (раз в 5 сек.) → (раз в 1 сек.).</span></div><div class="tb t-b"><b class="tn">Дестабилизация</b><span>умение питомца или резонанс дают +10 к «Флуктуации» → +20.</span></div><div class="tb t-b"><b class="tn">Сдвиги сознания</b><span>умение даёт +5 к «Флуктуации» → +10.</span></div><div class="tb t-b"><b class="tn">Колебания</b><span>базовая атака даёт +1 к «Флуктуации» → +2.</span></div>'),
  ]},

{id:'nx_syn',tab:'Что собирать',title:'Нексум: что собирать, связки скрижал',

 bosses:[
 {id:'sy_p',name:'Что брать в первую очередь',who:'порядок выбора',must:['Выбирай под одну механику, а не по одной из каждого','Сравнивай Озарение с усилениями своего билда','Связки ниже, в каждой ядро и усилители'],
  steps:[

 {id:'sy_depth',name:'Перки «Глубин»',who:'выбираются два перка перед походом',must:['Порядок и доступность перков зависят от открытия','Результат случайных эффектов не гарантирован'],
  steps:[

   S(null,'Фантомные спутники и Разлом измерений',`<div class="tb t-p"><b class="tn">Фантомные спутники</b><span>После каждого зала сложности «Кошмар» шанс создания Печати измерений повышается на 8%. Без таких залов эффект не запускается.</span></div><div class="tb t-p"><b class="tn">Разлом измерений</b><span>Урон фантомов, вызванных Печатями измерений, +300%. Перк срабатывает на фантомов, вызванных Печатями измерений.</span></div>`),
   S(null,'Западня и Тайные откровения',`<div class="tb t-p"><b class="tn">Западня</b><span>Если наложено 4 или более проклятия, шанс скрижали с тайнописью повышается на 6% при входе в новый зал. С Монархом «Наперекор судьбе» проклятия дают и силу атаки. Проклятия действуют на группу.</span></div><div class="tb t-p"><b class="tn">Тайные откровения</b><span>Открывается после получения 30 скрижалей с тайнописью за одну экспедицию.</span></div>`),

  ]},
 {id:'sy_sets',name:'Какие два перка взять',who:'готовые пары под задачу',must:['По умолчанию попробуй Библиотекаря и Козырную карту','Каждая пара занимает оба слота Глубин'],
  steps:[

   S(null,'Больше случайных скрижалей',`<b>Знаток лабиринта + Козырная карта.</b> Принимаешь две случайные скрижали вместо выбора одной; Козырная карта иногда удваивает награду. Подходит для экспериментов и набора коллекции, но может не дать нужного усиления.`),

   S(null,'Поход через печати и фантомов',`<b>Фантомные спутники + Разлом измерений.</b> Залы «Кошмар» повышают шанс создать печать; полученная печать позволяет вызвать фантома, а Разлом усиливает его урон. До появления печати прямой пользы от Разлома нет. В соло одновременно активен один фантом каждого типа; другие такие же печати усиливают его, а в группе каждый игрок вызывает одного случайного из доступных. Не путай этих фантомов с призывами классовых умений.`),
   S(null,'Артефакты вместо реагентов',`<b>Торговый путь + Библиотекарь</b> или <b>Торговый путь + Козырная карта.</b> Ищи полезные артефакты у торговцев, но следи за тинктурой и запасом осколков. Это альтернатива обычной сборке, а не гарантированно лучшая комбинация.`)

{id:'nx_art',tab:'Артефакты',title:'Нексум: артефакты',
 chips:['на весь поход','разовые эффекты'],
 lead:'Артефакты дают бонус на весь поход или разовый эффект при получении. В группе действуют на всех. Подробности есть в игре: <b>Нексум → Атлас → Артефакты</b>.',
 bosses:[
 {id:'ar0',name:'Все артефакты',who:'от сильных к мелким',must:['Бонус «в инвентаре» работает, пока артефакт у тебя','Венцы и «Астролябия» дают выбор скрижали','Перышки меняют один артефакт на бонус'],
  steps:[
   S(null,'🟧 Сильные бонусы на весь поход (22)','<div class="tb t-o"><b class="tn">Корона завоевателя</b><span>Бонус к урону в Нексуме повышается на 80%, а устойчивость к урону в Нексуме - на 25%. (копию не сделать)</span></div><div class="tb t-o"><b class="tn">«Как закаляют сталь»</b><span>Сила атаки в Нексуме повышается на 16%. Если этот артефакт получен в зале битвы с боссом, сила атаки в Нексуме дополнительно повышается на 8%.</span></div><div class="tb t-o"><b class="tn">Перышко дрозда</b><span>Вы выбираете артефакт и избавляетесь от него. Урон способностей проводников +70%. (копию не сделать)</span></div><div class="tb t-o"><b class="tn">Перышко королька</b><span>Вы выбираете артефакт и избавляетесь от него. За каждый Тайный зал, который вы посетили, сила атаки в Нексуме повышается на 10%. (копию не сделать)</span></div><div class="tb t-o"><b class="tn">Воробьиное перышко</b><span>Вы выбираете артефакт и избавляетесь от него. Если количество улучшенных скрижалей составляет не менее 60% от общего, при смене зала бонус к урону в Нексуме повышается на 40%. (копию не сделать)</span></div><div class="tb t-o"><b class="tn">Перышко малиновки</b><span>Вы выбираете артефакт и избавляетесь от него. Озарение +4. (копию не сделать)</span></div><div class="tb t-o"><b class="tn">«Гибель мира», часть I</b><span>Бонус к урону в Нексуме +1/8. Когда Скорость получения осколков эпох не ниже 50%: при смене зала бонус к урону в Нексуме дополнительно +1/8.</span></div><div class="tb t-o"><b class="tn">«Гибель мира», часть II</b><span>Бонус к урону в Нексуме +1/8. Когда Шанс получить улучшенную скрижаль не ниже 40%: при смене зала бонус к урону в Нексуме дополнительно +1/8.</span></div><div class="tb t-o"><b class="tn">«Гибель мира», часть III</b><span>Бонус к урону в Нексуме +1/8. Когда Шанс появления тайнописи не ниже 30%: при смене зала бонус к урону в Нексуме дополнительно +1/8.</span></div><div class="tb t-o"><b class="tn">«Гибель мира», часть IV</b><span>Бонус к урону в Нексуме +1/8. Когда уровень тинктуры не ниже 20-го: при смене зала бонус к урону в Нексуме дополнительно +1/8.</span></div><div class="tb t-o"><b class="tn">Идеально сбалансированные весы</b><span>Все товары у странствующих торговцев стоят на 50% дороже. При удалении: За каждые 200 осколков эпох урон в Нексуме повышается на 3% (вплоть до 300%).</span></div><div class="tb t-o"><b class="tn">Знак Гильдии</b><span>Вы получаете случайное проклятие. При входе в каждый новый зал вы получаете 20% бонус к урону в Нексуме. Длительность действия этого бонуса зависит от количества полученных скрижалей.</span></div><div class="tb t-o"><b class="tn">Стяг авангарда</b><span>За каждые 7 скрижалей урон в Нексуме повышается на 4% вплоть до 20%.</span></div><div class="tb t-o"><b class="tn">Стяг гвардии</b><span>За каждые 3 артефакта урон в Нексуме повышается на 4% вплоть до 20%.</span></div><div class="tb t-o"><b class="tn">Стяг арьергарда</b><span>За каждые 6 уровней тинктуры урон в Нексуме повышается на 4% вплоть до 20%.</span></div><div class="tb t-o"><b class="tn">Жезл иерофанта</b><span>Вы получаете одну возможность выбрать улучшенную скрижаль. Когда количество улучшенных скрижалей достигнет 7, сила атаки в Нексуме повысится на 8000 ед.</span></div><div class="tb t-o"><b class="tn">Перчатки кровавой охоты</b><span>Каждый раз, когда ваша атака попадает в цель, скорость передвижения повышается на 0,5% на 2 сек. Эффект суммируется до 100 раз. Количество попыток уклонения при этом уменьшается на 2. (копию не сделать)</span></div><div class="tb t-o"><b class="tn">Щит рыцаря розы и шипа</b><span>Каждые 15 сек. текущее время восстановления той сверхспособности, до восстановления которой осталось дольше всего, сокращается на 60% и на 20% дополнительно за каждое наложенное на вас проклятие.</span></div><div class="tb t-o"><b class="tn">Записки авантюриста</b><span>За каждый зал задания или случайной встречи, который вы посетили, бонус к урону в Нексуме повышается на 2%, а Скорость получения осколков эпох - на 1%.</span></div><div class="tb t-o"><b class="tn">Батальная поэма</b><span>За каждый зал обычной или героической битвы, который вы посетили, сила атаки в Нексуме повышается на 1000 ед., а Шанс получить улучшенную скрижаль - на 1%.</span></div><div class="tb t-o"><b class="tn">Записи счетовода</b><span>За каждый зал встречи с торговцем или битвы с боссом, который вы посетили, сила атаки в Нексуме повышается на 600 ед., а Шанс появления тайнописи - на 1%.</span></div><div class="tb t-o"><b class="tn">Средний нагрудник дозорного</b><span>Скорость получения осколков эпох +6%. Шанс получить улучшенную скрижаль +6%. Шанс появления тайнописи +6%.</span></div>'),
   S(null,'🟪 Полезные (24)','<div class="tb t-p"><b class="tn">Астролябия</b><span>Позволяет выбрать одну легендарную скрижаль.</span></div><div class="tb t-p"><b class="tn">Звездный компас</b><span>Вы получаете эпическую скрижаль вашего проводника. На ней будут тайные письмена.</span></div><div class="tb t-p"><b class="tn">Золотой венец</b><span>Вы выбираете одну скрижаль вида Свой путь из набора, где гарантированно есть легендарная.</span></div><div class="tb t-p"><b class="tn">Серебряный венец</b><span>Вы выбираете одну скрижаль вида Свой путь из набора, где гарантированно есть эпическая.</span></div><div class="tb t-p"><b class="tn">Медный венец</b><span>Вы получаете две случайные скрижали вида Свой путь.</span></div><div class="tb t-p"><b class="tn">«Астрология и астрономия»</b><span>Вы получаете две случайных скрижали Звездочета или Сновидца. Если этот артефакт получен в зале битвы с боссом, скрижали будут улучшенными.</span></div><div class="tb t-p"><b class="tn">Талисман заядлого игрока</b><span>+1 попытка при замене набора скрижалей. Каждая попытка замены стоит на 50% дешевле.</span></div><div class="tb t-p"><b class="tn">Гадальный кубик</b><span>Шанс появления тайнописи +7%. При удалении: Шанс появления тайнописи +14%.</span></div><div class="tb t-p"><b class="tn">Звонкий колокольчик</b><span>Шанс получить улучшенную скрижаль +11%. При удалении: Шанс получить улучшенную скрижаль +22%.</span></div><div class="tb t-p"><b class="tn">Боевой рог</b><span>При каждом входе в зал вы бесплатно активируете один эффект тинктуры.</span></div><div class="tb t-p"><b class="tn">«О зельях и микстурах»</b><span>максимальное количество реагентов в тинктуре увеличивается на 1. Если этот артефакт получен в зале битвы с боссом, уровень тинктуры повышается на 5.</span></div><div class="tb t-p"><b class="tn">Медальон алхимика</b><span>Заканчивая исследование любого зала, вы получаете возможность создать реагент. (копию не сделать)</span></div><div class="tb t-p"><b class="tn">«О преобразовании материи»</b><span>Вероятность создать печать измерений при синтезе реагентов повышается на 5%. (копию не сделать)</span></div><div class="tb t-p"><b class="tn">Поршневые сапоги</b><span>Завершив испытания в трех любых залах, вы улучшаете три случайные скрижали.</span></div><div class="tb t-p"><b class="tn">Жезл зачарователя</b><span>Вы улучшаете от 1-й до 3-х случайных скрижалей.</span></div><div class="tb t-p"><b class="tn">Ледяной янтарь</b><span>Вы получаете одно случайное проклятие и создаете копии двух случайных артефактов. (копию не сделать)</span></div><div class="tb t-p"><b class="tn">Обледеневший компас</b><span>Вы получаете одно случайное проклятие и улучшаете две скрижали по вашему выбору. Туман вокруг порталов в неизвестность рассеивается.</span></div><div class="tb t-p"><b class="tn">Морозная ветвь</b><span>Вы получаете одно случайное проклятие, а затем три скрижали. Качество этих скрижалей зависит от глубины погружения в Нексум.</span></div><div class="tb t-p"><b class="tn">Колокольчик негоцианта</b><span>Вы выбираете артефакт и избавляетесь от него. Затем вы выбираете другой артефакт и создаете его копию. (копию не сделать)</span></div><div class="tb t-p"><b class="tn">Заснеженный тотем</b><span>Вы получаете одно случайное проклятие. Вы накладываете на противников эффект Снежный вихрь каждый раз при входе в зал (на 45 сек.) и после возрождения (на 15 сек.).</span></div><div class="tb t-p"><b class="tn">Любовный сонет</b><span>При каждом входе в Тайный зал вы с вероятностью 50% получаете 1 уровень эффекта Предчувствие тайны.</span></div><div class="tb t-p"><b class="tn">Старинная медаль</b><span>В следующих пяти залах количество скрижалей в трофеях зала с 50% вероятностью удваивается.</span></div><div class="tb t-p"><b class="tn">Сборник ребусов и загадок</b><span>Все порталы теперь ведут в неизвестность. При входе в каждый новый зал вы получаете 22 осколка эпох.</span></div><div class="tb t-p"><b class="tn">Сокровище песков</b><span>Скорость получения осколков эпох +15%. При удалении: Скорость получения осколков эпох +30%.</span></div>'),
   S(null,'🟦 Разовые и мелкие (8)','<div class="tb t-b"><b class="tn">Скидочный купон</b><span>все предметы у торговцев стоят на 15% дешевле.</span></div><div class="tb t-b"><b class="tn">Неприметный купон</b><span>Позволяет получить 50 осколков эпох и открывает портал в Тайный зал, где можно встретить особого торговца.</span></div><div class="tb t-b"><b class="tn">Талончик от камеры хранения</b><span>Вы получаете от одного до трех случайных артефактов.</span></div><div class="tb t-b"><b class="tn">Проклятый лотерейный билет</b><span>Накладывает случайное проклятие, а затем выдает выигрыш: 120 осколков эпох и еще по 40 за каждое наложенное на вас проклятие.</span></div><div class="tb t-b"><b class="tn">Венок травницы</b><span>Вы получаете два случайных реагента, один из которых гарантированно будет III уровня.</span></div><div class="tb t-b"><b class="tn">Неразменная монетка</b><span>В следующих трех залах вы фиксированно получаете осколки эпох в размере 1/10 от текущего количества (но не более 70). Если у вас есть 5 или больше скрижалей с тайнописью, вы получаете осколки эпох в размере 1/7 от текущего количества (но не более 100).</span></div><div class="tb t-b"><b class="tn">Часы искаженного времени</b><span>Вы снимаете с себя одно проклятие по своему выбору, а взамен получаете два сглаза. При удалении: Вы получаете этот артефакт заново.</span></div><div class="tb t-b"><b class="tn">Парные кольца</b><span>Вы получаете 60 осколков эпох. Если номер зала, в котором вы находитесь, четный, это количество удваивается.</span></div>'),
  ]}
 ]},

{id:'twinks',tab:'Твинки и общий склад',title:'Твинки: фарм золота и общий склад',
 chips:['B → Склад','вкладка «Учетная запись»','банковский счёт'],

  if(!boxes)return '';
  const left=x=>x/1120*100;
  const top=y=>y/630*100;
  return boxes.map(([x1,y1,x2,y2])=>`<span class="shot-frame" aria-hidden="true" style="left:${left(x1)}%;top:${top(y1)}%;right:${100-left(x2)}%;bottom:${100-top(y2)}%"></span>`).join('');

const termKey=name=>name.toLowerCase().replace(/ё/g,'е');
const termForms=new Map([...guideTerms].map(([name,value])=>[termKey(name),value]));
for(const [name,forms] of Object.entries({
  'Монарх':['Монарха','Монарху','Монархом'], 'Фанатик':['Фанатика','Фанатику','Фанатиком'],

const termPattern=new RegExp('(?<![а-яёa-z0-9])(?:'+[...termForms.keys()].sort((a,b)=>b.length-a.length).map(name=>name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')).join('|')+')(?![а-яёa-z0-9])','gi');

function linkGuideTerms(page){
  for(const target of guideTerms.values()){
    if(target.page!==page||!target.step)continue;
    const label=document.getElementById(target.step)?.querySelectorAll('.tn')[target.index];
    if(label) (label.closest('.tb')||label).id=target.id;
  }
  const walk=document.createTreeWalker(document.querySelector('#view'),NodeFilter.SHOW_TEXT,{
    acceptNode:node=>node.parentElement?.closest('a,button,h2,h3,cite,.tn,.pager,.wiki-outline,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT
  });
  const nodes=[];
  while(walk.nextNode())nodes.push(walk.currentNode);
  for(const node of nodes){
    const matches=[...node.nodeValue.matchAll(termPattern)];
    if(!matches.length)continue;
    const fragment=document.createDocumentFragment();
    let offset=0;
    for(const match of matches){
      const target=termForms.get(termKey(match[0]));
      if(target.page.startsWith('nx_')&&!['nexus','nx_tab','nx_syn','nx_art','nx_alch'].includes(page))continue;
      if(target.page===page)continue;
      fragment.append(node.nodeValue.slice(offset,match.index));
      const a=document.createElement('a');
      a.className='guide-term';
      a.href='#'+target.page+'/'+target.id;
      a.style.color=target.color;
      a.textContent=match[0];
      fragment.append(a);
      offset=match.index+match[0].length;
    }
    if(offset){
      fragment.append(node.nodeValue.slice(offset));
      node.replaceWith(fragment);
    }
  }
}
function xlink(cur){

  if(!document.getElementById('xlcss')){const st=document.createElement('style');st.id='xlcss';st.textContent='.xl{text-decoration:underline dotted;text-underline-offset:3px;color:inherit;cursor:pointer}.xl:hover{color:var(--dc,#7dd3fc)}';document.head.appendChild(st);}
  const SKIP={energy:['beast','beastkr'],terms:['fleet']};
  const inNexum=['nexus','nx_tab','nx_syn','nx_art','nx_alch'].includes(cur);
  const parts=XL.filter(x=>x[0]!==cur&&!(SKIP[x[0]]||[]).includes(cur)&&
    (x[2]!=='s-nx_run-1'||inNexum)&&EXP.some(e=>e.id===x[0]))
    .sort((a,b)=>Number(b[1].includes(' '))-Number(a[1].includes(' ')));
  if(!parts.length)return;
  const res=parts.map(([page,pattern,target])=>[page,new RegExp('^(?:'+pattern+')$','i'),target]);
  const big=new RegExp('(?<![а-яёa-z0-9])(?:'+parts.map(x=>'(?:'+x[1]+')').join('|')+')(?![а-яёa-z0-9])','gi');
  const ttl=id=>(EXP.find(e=>e.id===id)||{}).tab||id;
  document.querySelectorAll('#view .lead,#view .note-box,#view .must li,#view .txt,#view td,#view .nx-choice-body').forEach(c=>{

    const w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('a,button,h2,h3,cite,.xl')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{
      const t=n.nodeValue;big.lastIndex=0;let m,last=0,frag=null;
      while((m=big.exec(t))){
        if(m[0].length>2&&m[0]===m[0].toUpperCase())continue;
        const hit=res.find(r=>r[1].test(m[0]));
        if(!hit)continue;
        if(!frag)frag=document.createDocumentFragment();
        frag.appendChild(document.createTextNode(t.slice(last,m.index)));
        const a=document.createElement('a');a.className='xl';a.href='#'+hit[0]+(hit[2]?'/'+hit[2]:'');a.title='Открыть раздел: '+ttl(hit[0]);a.textContent=m[0];
        frag.appendChild(a);last=m.index+m[0].length;
      }
      if(frag){frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n);}
    });
  });
}

function prepareTables(view){
  for(const table of view.querySelectorAll('.tbl table')){
    const [header,...entries]=Array.from(table.rows);
    if(!header||header.cells.length<3||!entries.length)continue;
    const cols=Array.from(header.cells);
    if(cols.some(cell=>cell.tagName!=='TH'||cell.colSpan!==1||cell.rowSpan!==1))continue;
    if(entries.some(row=>row.cells.length!==cols.length||Array.from(row.cells).some(cell=>cell.tagName!=='TD'||cell.colSpan!==1||cell.rowSpan!==1)))continue;
    table.closest('.tbl').classList.add('mobile-table');
    table.setAttribute('role','table');
    header.classList.add('table-head');
    header.setAttribute('role','row');
    cols.forEach(cell=>{cell.scope='col';cell.setAttribute('role','columnheader');});
    for(const row of entries){
      row.classList.add('table-entry');
      row.setAttribute('role','row');
      Array.from(row.cells).forEach((cell,i)=>{
        cell.setAttribute('role','cell');
        const title=cols[i].textContent.trim();
        if(!title)return;
        const label=document.createElement('span');
        label.className='table-field-label';
        label.setAttribute('aria-hidden','true');
        label.textContent=title;
        cell.prepend(label);
      });
    }
  }
}

let GOTO=null;
function route(){
  if(location.hash==='#itemuse')history.replaceState(null,'','#itembook');
  const [id,anchor]=(location.hash||'#home').slice(1).split('/');
  if(id==='home'){renderHome();window.scrollTo(0,0);return;}
  if(id==='classes'&&(anchor==='b-warlock'||Object.hasOwn(warlockSkillAliases,anchor))){
    const skill=warlockSkillAliases[anchor];
    const target=skillBookUrl('warlock',skill);
    history.replaceState(null,'',target);
    render('skillbook');
    return;
  }
  render(id);
  const target=document.getElementById(GOTO||anchor||'');
  GOTO=null;
  if(target)scrollToArticleTarget(target);
  else window.scrollTo(0,0);
}
function scrollToArticleTarget(target){
  const details=target.closest('details');
  if(details)details.open=true;
  target.scrollIntoView({block:'start'});
  target.classList.remove('hit');
  void target.offsetWidth;
  target.classList.add('hit');
}
/* ---------- search ---------- */
const strip=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const norm=t=>t.toLowerCase().replace(/ё/g,'е');
const IDX=[];
EXP.forEach(e=>{const g=wikiNavGroups.find(x=>x.ids.includes(e.id));const base={tab:e.id,tabName:e.tab,grp:g?g.name:'',dc:DC[e.id]};
  IDX.push({...base,sid:null,where:'',title:e.title||e.tab,text:strip((e.lead||'')+' '+(e.chips||[]).join(' ')+' '+(e.table||[]).flat().join(' ')+' '+(e.notes||[]).map(n=>n[1]).join(' '))});
  if(e.tpl){const t=document.getElementById(e.tpl);if(t)IDX.push({...base,sid:null,where:'',title:e.tab,text:strip(t.innerHTML)});}
  (e.bosses||[]).forEach(b=>{IDX.push({...base,sid:null,boss:b.id,where:'',title:b.name,text:strip(b.who+' '+b.must.join(' '))});
    b.steps.forEach((st,si)=>{if(st.phase)return;IDX.push({...base,sid:`s-${b.id}-${st.anchor??si}`,where:b.name,title:strip(st.see),text:strip(st.see+' '+st.do+' '+(st.x||''))});});});});
IDX.forEach(r=>{r.nt=norm(r.title);r.nx=norm(r.title+' '+r.text);});
const escH=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function snip(text,words){const n=norm(text);let p=-1;for(const w of words){p=n.indexOf(w);if(p>=0)break;}
  let a=Math.max(0,p-50),b=Math.min(text.length,(p<0?0:p)+110);let out=(a?'…':'')+text.slice(a,b)+(b<text.length?'…':'');
  out=escH(out);words.forEach(w=>{if(w.length<2)return;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')+')','gi');out=out.replace(re,'<mark>$1</mark>');});return out;}
let SEL=-1,HITS=[];
function computeHits(q){const words=norm(q).split(/\s+/).filter(Boolean);
  if(!words.length||norm(q).length<2){HITS=[];return words;}
  HITS=IDX.filter(r=>words.every(w=>r.nx.includes(w))).map(r=>({r,score:(words.every(w=>r.nt.includes(w))?10:0)+(r.sid?1:3)})).sort((a,b)=>b.score-a.score).slice(0,40).map(x=>x.r);
  return words;}
function hitsMarkup(words){return `<div class="rhead">${HITS.length?('Найдено: '+HITS.length+(HITS.length===40?'+':'')):'Ничего не найдено - попробуй другое слово'}</div>`+HITS.map((r,i)=>`<a href="#${r.tab}" data-i="${i}" class="${i===0?'sel':''}"><div class="path" style="--dc:${r.dc||'var(--accent)'}"><i></i>${escH(r.grp)} › ${escH(r.tabName)}${r.where?' › '+escH(r.where):''}</div><div class="ttl">${snip(r.title,words)}</div>${r.text&&r.text!==r.title?`<div class="snip">${snip(r.text,words)}</div>`:''}</a>`).join('');}
function wireHits(container){container.querySelectorAll('a').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();openHit(+a.dataset.i);}));}
function search(q){const res=$('#res');const words=computeHits(q);
  if(norm(q).length<2){res.hidden=true;return;}
  SEL=HITS.length?0:-1;
  res.innerHTML=hitsMarkup(words);
  res.hidden=false;
  wireHits(res);}
function openHit(i){const r=HITS[i];if(!r)return;$('#res').hidden=true;$('#q').blur();
  GOTO=r.sid||(r.boss?'b-'+r.boss:null);
  const destination='#'+r.tab+(GOTO?'/'+GOTO:'');
  if(location.hash===destination)route();else location.hash=destination;}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('focus',e=>{if(e.target.value)search(e.target.value);});
$('#q').addEventListener('keydown',e=>{const items=[...document.querySelectorAll('#res a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;SEL=(SEL+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.classList.toggle('sel',i===SEL));items[SEL].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){e.preventDefault();openHit(Math.max(SEL,0));}
  else if(e.key==='Escape'){e.target.value='';setSearchOpen(false);e.target.blur();if(matchMedia('(max-width:900px)').matches)searchToggle.focus();}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.code==='KeyF'||e.code==='KeyK')){e.preventDefault();focusSearch();$('#q').select();return;}
  if(e.key==='/'&&document.activeElement!==$('#q')&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();focusSearch();}});
document.addEventListener('click',e=>{
  if(!e.target.closest('#nav'))setSearchOpen(false);
  if(!e.target.closest('#nav-more'))$('#nav-more').open=false;
});
document.addEventListener('keydown',e=>{
  const more=$('#nav-more');
  if(e.key==='Escape'&&more.open){more.open=false;more.querySelector('summary').focus();}
  else if(e.key==='Escape'&&compactNav.matches&&$('#article-menu').open){
    $('#article-menu').open=false;
    $('#article-menu > summary').focus();
  }
});
document.body.insertAdjacentHTML('beforeend','<button class="totop" aria-label="Наверх">↑</button>');
(()=>{const b=document.querySelector('.totop');addEventListener('scroll',()=>b.classList.toggle('show',scrollY>900),{passive:true});b.onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});})();
document.addEventListener('click',e=>{
  if(e.target.closest('#sub a'))$('#q').blur();
  const local=e.target.closest('#article-menu-pane .wiki-outline a[href^="#"]');
  if(local&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey){
    const [page,anchor]=local.hash.slice(1).split('/');
    const target=anchor&&document.getElementById(anchor);
    if(page===(location.hash||'#home').slice(1).split('/')[0]&&target?.closest('#view')){
      e.preventDefault();
      if(page!=='skillbook'&&location.hash!==local.hash)history.pushState(null,'',local.hash);
      scrollToArticleTarget(target);
    }
  }
  if(compactNav.matches&&(!e.target.closest('#article-menu')||e.target.closest('#article-menu-pane a'))){
    $('#article-menu').open=false;
  }
});
function fillHomeCounts(){
  fetch('data/items.json').then(r=>r.json()).then(d=>{const el=$('#home-count-items');if(el)el.textContent=d.length.toLocaleString('ru-RU')+' предметов';}).catch(()=>{const el=$('#home-count-items');if(el)el.textContent='каталог';});
  fetch('data/gearbook.json').then(r=>r.json()).then(d=>{const el=$('#home-count-gear');if(el)el.textContent=d.sets.length+' комплектов · '+d.weapons.length+' оружия';}).catch(()=>{const el=$('#home-count-gear');if(el)el.textContent='каталог';});
}
function renderHome(){
  CUR='home';K='';
  const v=$('#view');v.classList.remove('dcv');v.style.removeProperty('--dc');
  $('#article-menu-pane .wiki-outline')?.remove();
  const articleMenu=$('#article-menu');
  if(v.contains(articleMenu))$('#article-menu-home').append(articleMenu);
  renderNav('home');
  const specCount=classCatalog.reduce((n,g)=>n+g.steps.length,0);
  const cards=[
    {id:'terms',name:'Основы',count:'4 статьи',desc:'Понятия, стартовый путь, классы и умения - с чего начать.'},
    {id:'itembook',name:'Предметы',count:'загрузка…',dyn:'items',desc:'Каталог предметов: свойства, источники, цены.'},
    {id:'gearbook',name:'Снаряжение',count:'загрузка…',dyn:'gear',desc:'Комплекты, оружие специализаций и путь к Абсолюту.'},
    {id:'skillbook',name:'Справочник умений',count:specCount+' специализаций',desc:'Все умения всех классов с цифрами из игры.'},
    {id:'gear',name:'Прокачка',count:'9 статей',desc:'Закалка, калибровка, арретиры, руны и гравировки.'},
    {id:'basics',name:'Экспедиции',count:'11 гайдов',desc:'Пошаговые разборы всех данжей и боссов.'},
    {id:'nexus',name:'Нексум',count:'5 статей',desc:'Перки, скрижали, артефакты и готовые связки.'},
    {id:'currency',name:'Фарм и обмен',count:'6 статей',desc:'Валюты, магазины, аукцион, карты и энергия.'},
    {id:'calculators',name:'Калькуляторы',count:'2 инструмента',desc:'Стоимость закалки и сумма характеристик.'},
    {id:'fleet',name:'Активности',count:'2 статьи',desc:'Флотилия и недельное расписание.'}
  ];
  const cardsHtml=cards.map(c=>`<a class="home-card" href="#${c.id}"><strong>${c.name}</strong><span class="home-card-count"${c.dyn?` id="home-count-${c.dyn}"`:''}>${c.count}</span><span class="home-card-desc">${c.desc}</span></a>`).join('');
  const classesHtml=classCatalog.map(g=>`<div class="home-class"><h3>${g.name}</h3><div class="home-specs">${g.steps.map(s=>`<a href="#skillbook/${s.anchor}"><img src="img/coa-class-${s.anchor}.webp" alt="" width="40" height="40" loading="lazy"><span>${s.className}</span></a>`).join('')}</div></div>`).join('');
  $('#view').innerHTML=`<section class="home-hero">
    <h2>Кристалл Атлана · Вики</h2>
    <p>Гайды, справочники и калькуляторы по игре: умения, снаряжение, предметы, экспедиции и Нексум - собрано и проверено игроками.</p>
    <div class="home-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="home-q" type="search" autocomplete="off" placeholder="Поиск по вики: умение, предмет, босс…" aria-label="Поиск по вики"><kbd>Ctrl K</kbd></div>
    <div id="home-res" class="home-res" hidden></div>
  </section>
  <section class="home-grid">${cardsHtml}</section>
  <section class="home-classes"><h2 class="home-sec">Классы и специализации <small>${classCatalog.length} классов · ${specCount} специализаций</small></h2>${classesHtml}</section>`;
  mountSectionNavigation();
  const hq=$('#home-q'),hres=$('#home-res');
  hq.addEventListener('input',()=>{
    const words=computeHits(hq.value);
    if(norm(hq.value).length<2){hres.hidden=true;return;}
    SEL=HITS.length?0:-1;
    hres.innerHTML=hitsMarkup(words);
    hres.hidden=false;
    wireHits(hres);
  });
  hq.addEventListener('keydown',e=>{const items=[...hres.querySelectorAll('a')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;SEL=(SEL+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.classList.toggle('sel',i===SEL));items[SEL].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();openHit(Math.max(SEL,0));}
    else if(e.key==='Escape'){hq.value='';hres.hidden=true;hq.blur();}});
  fillHomeCounts();
}
function renderFooter(){
  $('#foot').innerHTML='<div class="foot-grid">'+wikiNavGroups.map(g=>`<div class="foot-col"><strong>${g.name}</strong>${g.ids.map(id=>{const p=EXP.find(x=>x.id===id);return p?`<a href="#${id}">${p.tab}</a>`:''}).join('')}</div>`).join('')+'</div><p class="foot-note">Автор гайда - <b>Ахинея</b>. Пометка «совет игроков» - опыт игроков; числа там могут отличаться от нашей версии.</p>';
}
renderFooter();
window.addEventListener('hashchange',route); route();
(async()=>{try{if(window.claude&&claude.use){CM=await claude.use('comments');wireComments();}}catch(err){}})();
</script>
