<style>

/* Layout: one expedition per view (hash). Boss = header with "Кратко" + numbered steps; each step = screenshot | text side by side */
:root{
  --bg:#f3f2f7; --panel:#ffffff; --panel2:#ecebf3; --fg:#1d1b29; --muted:#5f5b75; --line:#d9d6e6;
  --accent:#5b45c9; --accent-soft:#e8e4fb; --fire:#c2410c; --ice:#0e7490; --wipe:#c81e1e; --wipe-bg:#fdecec; --tip-bg:#e9f6ee; --tip:#166534; --warn-bg:#fff6e0; --warn:#8a5a00;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111019; --panel:#1b1a26; --panel2:#25243a; --fg:#eeecf7; --muted:#a6a2bf; --line:#302e45;
  --accent:#a594ff; --accent-soft:#2b2650; --fire:#fb8c4a; --ice:#5fd3e8; --wipe:#ff6b6b; --wipe-bg:#3a1a20; --tip-bg:#152a1f; --tip:#7ee2a2; --warn-bg:#33290f; --warn:#f3c969; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111019; --panel:#1b1a26; --panel2:#25243a; --fg:#eeecf7; --muted:#a6a2bf; --line:#302e45;
  --accent:#a594ff; --accent-soft:#2b2650; --fire:#fb8c4a; --ice:#5fd3e8; --wipe:#ff6b6b; --wipe-bg:#3a1a20; --tip-bg:#152a1f; --tip:#7ee2a2; --warn-bg:#33290f; --warn:#f3c969; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1000px;margin:0 auto}
header.top{padding-block:24px 6px}
h1{font:400 clamp(26px,5vw,38px)/1.1 var(--f-display);margin:0 0 6px}
.sub{color:var(--muted);margin:0;max-width:72ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
nav.tabs a:hover,nav.tabs a:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
h2{font:400 clamp(24px,4vw,32px)/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:6px;background:var(--panel2);color:var(--muted)}
p.lead{margin:0 0 18px;max-width:72ch;font-size:16px}
h3.sec{font:700 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
/* boss order strip */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 20px}
.flow a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.flow a:hover,.flow a:focus-visible{border-color:var(--accent);outline:none}
.flow a b{font:700 12px/22px var(--f-mono);width:22px;height:22px;border-radius:50%;text-align:center;background:var(--accent);color:var(--bg)}
.flow a small{font-weight:500;color:var(--muted)}
.flow .arr{color:var(--muted)}
/* notes */
.note-box{display:grid;gap:8px;margin:0 0 20px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px}
.callout.tip{background:var(--tip-bg);color:var(--tip)} .callout.warn{background:var(--warn-bg);color:var(--warn)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);border-top:0;white-space:nowrap}
/* boss */
.boss{margin:34px 0 0;scroll-margin-top:80px}
.boss-head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.boss-head .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.boss-head h3{font:400 clamp(21px,3.4vw,26px)/1.2 var(--f-display);margin:0}
.boss-head .who{color:var(--muted);font-size:14px;font-weight:600}
.must{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.must b.lbl{display:block;font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.must ul{margin:0;padding-left:20px;display:grid;gap:4px}
/* step */
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step.noimg{grid-template-columns:minmax(0,1fr)}
.step.wipe{border-color:var(--wipe);box-shadow:inset 4px 0 0 var(--wipe)}
.shot{all:unset;cursor:zoom-in;display:block;background:var(--panel2);position:relative}
.shot img{display:block;width:100%;height:auto;max-width:100%}
.shot::after{content:"⤢ увеличить";position:absolute;right:8px;bottom:8px;font:600 11px/1 var(--f-body);color:#fff;background:rgba(0,0,0,.55);padding:5px 7px;border-radius:6px}
.shot:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.txt{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0}
.step:has(.tbl){grid-template-columns:minmax(0,1fr)}
.txt .tbl{margin-bottom:0}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num .n{font:700 15px/32px var(--f-mono);min-width:32px;height:32px;border-radius:8px;text-align:center;background:var(--panel2);color:var(--accent)}
.step.wipe .num .n{background:var(--wipe);color:var(--bg)}
.tag{font:700 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px}
.tag.w{background:var(--wipe);color:var(--bg)} .tag.f{background:var(--panel2);color:var(--fire)} .tag.i{background:var(--panel2);color:var(--ice)} .tag.src{background:var(--panel2);color:var(--muted)}
.lbl2{font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.see{font-weight:700;font-size:17px;line-height:1.35}
.do{font-size:15.5px}
.do b{color:var(--fg)}
/* Контраст и переносы в карточках умений */
#view .do .tb{min-width:0;gap:6px 12px;padding:10px 0}
#view .do .tb .tn{color:#171322;max-width:100%;overflow-wrap:anywhere;white-space:normal}
#view .do .tb span,.see{min-width:0;overflow-wrap:anywhere}
#view.dcv .step:not(.wipe):has(.tb){border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--dc)}
@media (max-width:720px){#view .do .tb{grid-template-columns:minmax(0,1fr);gap:6px}}
/* Раздел «Что собирать»: короткие заголовки и подробности по нажатию */
.nx-choice{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.nx-choice>summary{display:block;position:relative;padding:14px 40px 14px 16px;cursor:pointer;font-weight:700;line-height:1.35;list-style:none}
.nx-choice>summary::-webkit-details-marker{display:none}
.nx-choice>summary::after{content:'+';position:absolute;right:16px;top:10px;flex:none;color:var(--accent);font-size:22px;line-height:1}
.nx-choice[open]>summary::after{content:'−'}
.nx-choice>summary:hover{background:var(--panel2)}
.nx-choice>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.guide-icon{width:1.55em;height:1.55em;object-fit:contain;vertical-align:middle;margin-inline-end:.35em}
.boss,.step,.nx-choice,.tb[id]{scroll-margin-top:24px}
.guide-term{text-decoration:underline;text-underline-offset:3px;font-weight:600}.guide-term:hover{filter:brightness(1.18)}
.nx-choice-body{border-top:1px solid var(--line);padding:14px 16px;line-height:1.6;overflow-wrap:anywhere}
.nx-choice-body .tb:first-child{padding-top:0}
.extra{font-size:14px;color:var(--tip);background:var(--tip-bg);border-radius:8px;padding:8px 10px}
.phase{font:700 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 2px 0}
.phase.fire{color:var(--fire)} .phase.ice{color:var(--ice)}
dl.gloss{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px}
dl.gloss dt,dl.gloss dd{margin:0;padding:11px 14px;border-top:1px solid var(--line)}
dl.gloss dt{font-weight:700}
dl.gloss dt:first-of-type,dl.gloss dt:first-of-type+dd{border-top:0}
ol.check{margin:0 0 16px;padding:0;list-style:none;counter-reset:c;display:grid;gap:8px}
ol.check li{counter-increment:c;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
ol.check li::before{content:counter(c);font:700 14px/32px var(--f-mono);text-align:center;border-radius:8px;background:var(--panel2);color:var(--accent);width:32px;height:32px}
.todo{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.todo h4{font:400 17px/1.2 var(--f-display);margin:0 0 4px}
.todo p{margin:0;color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:32px;flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--accent);font-weight:700;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin:0 0 8px}
.foot{font-size:13px;color:var(--muted);margin-top:28px;max-width:76ch}
.foot a{color:var(--accent)}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1200px)}
dialog::backdrop{background:rgba(8,7,14,.86)}
dialog img{display:block;max-width:100%;max-height:84vh;border-radius:10px}
dialog p{color:#eeecf7;font-size:15px;margin:10px 2px 0}
dialog form{position:absolute;top:8px;right:8px}
dialog button.x{font:700 15px var(--f-body);background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 11px;cursor:pointer}
@media (max-width:720px){.step{grid-template-columns:minmax(0,1fr)} dl.gloss{grid-template-columns:minmax(0,1fr)} dl.gloss dd{border-top:0;padding-top:0}}
</style>

<style>

.tosearch svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round}
@media (max-width:720px){.tosearch.show{display:flex}}
@media (hover:none){nav.tabs .search .hint{display:none}.shot::after{content:"⤢"}}
@media (max-width:720px){
  body{font-size:16px;padding-bottom:96px}
  header.top{padding-block:12px 0}
  header.top .sub{display:none}
  h1{font-size:24px;margin-bottom:2px}
  nav.tabs{position:relative;top:auto;padding-top:6px;margin-bottom:14px;box-shadow:none}
  nav.tabs .search .hint{display:none}
  nav.tabs .sub{flex-wrap:nowrap!important}
  nav.tabs .bar{gap:8px}
  nav.tabs .grp{gap:4px;padding:3px}
  nav.tabs .grp a{min-height:48px;font-size:11px}
  nav.tabs .search input{min-height:44px;font-size:16px}
  nav.tabs .sub{padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding-left:16px}
  nav.tabs .sub a{min-height:44px;font-size:14px;padding:0 14px}
  nav.tabs .res{position:fixed;left:8px;right:8px;top:auto;max-height:65vh}
  .res a{padding:12px}
  h2{font-size:24px}
  .meta{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .flow{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 16px;padding:2px 16px;scrollbar-width:none}
  .flow a{flex:none;min-height:44px}
  .flow .arr{flex:none}
  .boss-head{padding:14px}
  .txt{padding:14px}
  .see{font-size:16.5px}
  .do{font-size:16px}
  .shot img{max-height:none}
  table{font-size:14px}
  th,td{padding:9px 10px}
  th{white-space:normal}
  .tbl{margin-left:-2px;margin-right:-2px}
  .pager a{flex:1;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center}
  dialog{max-width:100vw;width:100vw;margin:auto 0}
  dialog img{max-height:78vh;border-radius:0;width:100%;object-fit:contain}
  dialog p{padding:0 12px}
  dialog button.x{padding:10px 14px;font-size:18px}
  .cbtn{min-height:36px}
}

/* Оформление статей вики */
:root {
  --bg:#f5f4f0; --panel:#fff; --panel2:#eeece7; --fg:#252c31; --muted:#52606a; --line:#d8d9d5;
  --accent:#255a73; --accent-soft:#e9f0f3; --f-display:"Exo 2",var(--f-body);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14191e;--panel:#1b2229;--panel2:#242d36;--fg:#edf0f2;--muted:#b0bdc7;--line:#36424c;--accent:#a8c9db;--accent-soft:#253540}
}
:root[data-theme="dark"]{--bg:#14191e;--panel:#1b2229;--panel2:#242d36;--fg:#edf0f2;--muted:#b0bdc7;--line:#36424c;--accent:#a8c9db;--accent-soft:#253540}
body{margin:0}
#view,header.top,.wrap > .foot{width:100%;max-width:880px;margin-inline:auto}
header.top{padding:30px 0 20px;border-bottom:1px solid var(--line);margin-bottom:28px;text-align:center}
header.top h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.025em}
header.top .sub{margin:8px auto 0;font-size:14px}
#view h2,#view.dcv h2{border:0;padding:0;color:var(--fg);font-size:clamp(28px,4vw,42px);text-align:center;line-height:1.16}
#view > .lead{margin:18px auto 26px;max-width:72ch}
#view > .meta{justify-content:center}
.chip,.phase,.lbl2,.tag,.must b.lbl{font-family:var(--f-body);letter-spacing:.035em}
.chip{background:transparent;border:1px solid var(--line)}
#view .boss-head,#view.dcv .boss-head{border:0;border-top:1px solid var(--line);background:transparent;border-radius:0;padding:19px 0 0}
#view .boss-head h3,#view.dcv .boss-head h3{color:var(--fg);font-size:clamp(22px,3vw,28px)}
.must{background:var(--panel2);border-radius:5px}
#view .step:not(.wipe),#view.dcv .step:not(.wipe):has(.tb){border:1px solid var(--line);box-shadow:none}
.step,.nx-choice,.tbl{border-radius:7px}
#view .do .tb .tn{background:transparent;color:var(--fg);padding:0}
#view .guide-term,#view .xl{color:var(--accent)!important;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 58%,transparent);text-underline-offset:3px}
#view .do{font-size:16px;line-height:1.68}
.shot img,.step:has(.tbl) .shot img{height:auto;object-fit:contain;aspect-ratio:auto}
.shot{align-self:start}
.with-item-art .step-heading{display:flex;align-items:center;gap:.65rem;margin-bottom:.35rem}
.step-item-art{display:inline-grid;place-items:center;flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.step-item-art img{display:block;object-fit:contain}
.item-heading{display:inline-flex;align-items:center;gap:.55rem}
.shot-frame{position:absolute;border:2px solid #ff3737;border-radius:4px;box-shadow:0 0 0 1px #0006;pointer-events:none}
.shot-preview{position:relative;width:fit-content;max-width:100%;margin-inline:auto}
#lbimg{width:auto;height:auto}
#lb form{z-index:1}
#lb .shot-frame{border-width:3px}
@media(max-width:720px){#lb .shot-frame{border-width:2px}}
.flow{grid-auto-rows:auto!important}
.flow a{display:block!important;min-height:0;border-radius:5px}
.flow a b,.flow a small{display:none}
.wiki-tools{display:flex;justify-content:center;margin:10px 0 0}
.wiki-tools button{font:inherit;font-size:13px;color:var(--accent);border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:5px 10px;cursor:pointer}
@media(min-width:1000px){
  .wrap{max-width:1250px;grid-template-columns:235px minmax(0,1fr);column-gap:38px}
  .ag .ah,.ag .ah:hover,.ag .ah:focus-visible{background:var(--panel2);box-shadow:none}
  .ag .ah svg,.ag .ah i{color:var(--muted);stroke:var(--muted)}
  .ag .al,.ag .al a.nexus-child{border-color:var(--line)}
  .ag .al a.on{background:var(--accent-soft);box-shadow:inset 2px 0 var(--accent)}
}
@media(max-width:720px){header.top{padding:18px 0 12px;margin-bottom:14px}#view .txt{padding:14px}}

/* Вступление, оглавление и разделы статей */
.wiki-hero{display:grid;gap:26px;align-items:start;margin:0 0 30px;border-bottom:1px solid var(--line)}
.wiki-intro{min-width:0}
.wiki-intro-top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.wiki-category{display:inline-flex;align-items:center;gap:9px;color:var(--masthead-accent);font:700 13px/1.4 var(--f-body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.wiki-category::before{content:'';width:6px;height:6px;background:currentColor;transform:rotate(45deg)}
.wiki-category:hover{text-decoration:underline;text-underline-offset:4px}
#view .wiki-hero h2,#view.dcv .wiki-hero h2{color:var(--fg);font:700 clamp(31px,5vw,46px)/1.1 var(--f-display);letter-spacing:-.018em;text-align:left;text-wrap:balance;overflow-wrap:anywhere;margin:0 0 14px}
.wiki-hero .wiki-tools{margin:0}
.wiki-hero .wiki-tools button{background:transparent;color:var(--muted);min-height:36px}
.wiki-hero .wiki-tools button:hover{color:var(--accent);border-color:var(--accent)}
.wiki-intro .meta{flex-wrap:wrap;overflow:visible;gap:3px 12px;margin:12px 0 18px}
.wiki-intro .chip{padding:0;border:0;border-radius:0;color:var(--muted);font-size:13px;letter-spacing:0;white-space:normal}
.wiki-intro .chip+.chip::before{content:'·';margin-right:12px;color:var(--masthead-accent)}
#view .wiki-intro .lead{font-size:16px;line-height:1.7;max-width:70ch;margin:0 0 12px;color:var(--fg)}
#view .wiki-intro .lead:last-child{margin-bottom:0}
#view .wiki-intro a:not(.wiki-category){color:var(--accent);text-underline-offset:3px}
#view .wiki-outline{min-width:0;padding:11px 14px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.wiki-outline h3{margin:3px 0 5px;color:var(--muted);font:700 12px/1.4 var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.wiki-outline ul{list-style:none;padding:0;margin:0}
.wiki-outline li+li{border-top:1px solid var(--line)}
#view .wiki-outline a{display:flex;align-items:center;min-height:38px;padding:6px 2px;color:var(--fg);font:600 14px/1.4 var(--f-body);text-decoration:none;overflow-wrap:anywhere}
#view .wiki-outline a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
#view :is(.wiki-category,.wiki-outline a,.wiki-tools button):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view .boss-head,#view.dcv .boss-head{border:0;border-top:1px solid var(--line);margin-bottom:16px;padding:18px 0 0}
#view .boss-head h3,#view.dcv .boss-head h3,.wiki-gallery h3{color:var(--fg);font:700 clamp(22px,3vw,28px)/1.2 var(--f-display);text-wrap:pretty}
#view .boss-head .must{border-left:3px solid var(--article-accent,var(--line))}
#view .dgh{margin:24px 0 7px;padding:0;border:0;color:var(--masthead-accent);font:700 14px/1.4 var(--f-body)}
#view .tbl tbody tr:nth-child(even){background:color-mix(in srgb,var(--panel2) 55%,transparent)}
#view .step:not(.noimg){background:var(--panel)}
#view .shot{background:#18222b}
#view .see{font:700 18px/1.35 var(--f-display);margin:0}
#view .num:has(.cbtn[hidden]:only-child){display:none}
#view .do p{margin:10px 0}
#view .do p:last-child{margin-bottom:0}
#view .wiki-items{display:flex;flex-wrap:wrap;gap:8px 16px;list-style:none;padding:0;margin:12px 0 0}
.wiki-items li,.wiki-items a{display:flex;align-items:center;gap:8px;min-width:0}
.wiki-items a{color:var(--accent);min-height:40px;text-underline-offset:3px}
.wiki-items img{width:36px;height:36px;flex:none;object-fit:contain}
#view .boss .wiki-gallery{margin:0 0 16px}
#view .boss .wiki-gallery h4{margin:0;color:var(--muted);font:700 14px/1.35 var(--f-body)}

.skill-book-controls{display:grid;grid-template-columns:1.1fr 1fr 0.7fr;gap:12px;margin:18px 0 10px}
.skill-book-controls>div{min-width:0}
.skill-book-controls label,.skill-ranks label{display:block;margin:0 0 5px;color:var(--muted);font-weight:650}
.skill-book-controls :is(input,select),.skill-ranks select{box-sizing:border-box;padding:9px 11px;min-height:44px;width:100%;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit}
.skill-book-controls :is(input,select):focus-visible,.skill-ranks select:focus-visible,.skill-copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#skill-book-status{color:var(--muted);font-size:14px;margin:0 0 12px}
.skill-reference{scroll-margin-top:calc(var(--masthead-height,70px) + 16px)}
.skill-reference .class-skill{overflow-wrap:anywhere}
.skill-reference summary::after{top:50%;transform:translateY(-50%)}
.skill-summary{margin:0 0 12px}
.skill-stats{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 15px;margin:0}
.skill-stats dt{color:var(--muted)}
.skill-stats dd{min-width:0;margin:0}
.skill-traits{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:12px 0 0}
.skill-traits li{border:1px solid var(--line);border-radius:4px;color:var(--fg);padding:2px 7px;font-size:13px}
.skill-ranks{margin-top:12px}
.skill-ranks label{display:inline-block;margin:0 8px 0 0}
.skill-ranks select{width:5rem}
.skill-rank-result{margin:7px 0 0;color:var(--muted)}
.skill-pvp{margin:12px 0 0;padding-left:20px}
.skill-description{white-space:pre-line;overflow-wrap:anywhere}
.skill-pvp-description{margin-top:12px}
.skill-pvp-description p{margin:4px 0 0}
.gear-tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin:1.25rem 0 1rem;padding:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.gear-tabs a{flex:1 1 auto;display:grid;place-items:center;min-height:44px;padding:.4rem .55rem;border-radius:5px;text-align:center;text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:600}
.gear-tabs a:hover{background:var(--panel2);color:var(--fg)}
.gear-tabs [aria-current]{color:var(--fg);background:var(--panel2);box-shadow:inset 0 -2px var(--accent)}
.gear-class-choice{display:grid;grid-template-columns:minmax(0,280px) auto;align-items:end;justify-content:start;gap:.5rem 1rem;padding:.9rem 1rem;margin:1rem 0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px}
.gear-class-choice label{display:grid;gap:.3rem;font-weight:650}
.gear-class-choice select{min-height:44px;width:100%;padding:.5rem .65rem;font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:5px}
.gear-class-choice p{grid-column:1 / -1;margin:0;color:var(--muted);font-size:.9rem}
#gear-book-class-skills{align-self:end;display:flex;align-items:center;min-height:44px;font-size:.9rem}
#gear-book-class-skills[hidden]{display:none}
.gear-book-controls{display:flex;flex-wrap:wrap;gap:.75rem;margin:0 0 1rem;align-items:end}
.gear-book-controls label{display:grid;gap:.35rem;min-width:0;color:var(--fg);font-size:.875rem;font-weight:600}
.gear-book-controls label:not(:last-child){flex:1 1 10rem}
.gear-book-controls label:last-child{flex:2 1 15rem}
.gear-book-controls :is(select,input){width:100%;min-height:44px;padding:.55rem .7rem;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px}
.gear-book-controls input{font-weight:400}
.gear-book-controls [hidden]{display:none}
#gear-book-status:empty,.gear-book-controls:not(:has(>label:not([hidden]))){display:none}
#gear-book-list{gap:.8rem}
.gear-set-overview>summary{padding:1rem 2.65rem 1rem 1rem}
.gear-set-overview>summary::after{top:1.25rem}
.gear-set-heading{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .75rem}
.gear-set-tags{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem}
.gear-set-badge{display:inline-flex;align-items:center;padding:.2rem .45rem;border:1px solid var(--line);border-radius:4px;font-size:.8rem;font-weight:650;line-height:1.25}
.gear-rarity-epic{color:#84510c;border-color:#b98542}
.gear-rarity-eternal{color:#a73518;border-color:#c65f39}
[data-theme="dark"] .gear-rarity-epic{color:#ffd28f}
[data-theme="dark"] .gear-rarity-eternal{color:#ffac8b}
.gear-class-recommendation{color:var(--accent);border-color:currentColor}
.gear-set-icons{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.65rem}
.gear-set-preview{display:block;width:38px;height:38px;flex:none;object-fit:contain;background:var(--panel2);border:1px solid var(--line);border-radius:5px}
.gear-set-preview-eternal{border:2px solid #c65f39}
.gear-set-name{font-size:1.1rem;overflow-wrap:anywhere}
.gear-set-category{color:var(--muted);font-size:.825rem;font-weight:500;margin-right:.15rem}
.gear-set-notes{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:.8rem 1.2rem;margin-top:.75rem}
.gear-set-note{display:grid;align-content:start;gap:.25rem;color:var(--fg);font-size:.95rem;font-weight:400;line-height:1.5}
.gear-set-note:nth-child(3){grid-column:1 / -1;border-top:1px solid var(--line);padding-top:.55rem}
.gear-note-label{color:var(--accent);font-size:.875rem;font-weight:650}
.gear-profile{margin:0 0 .8rem}
#view .gear-set-subhead{margin:0 0 .7rem;font-size:1.125rem;line-height:1.35;color:var(--fg)}
.gear-bonuses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));align-items:start;gap:.55rem;margin:0 0 1rem}
.gear-bonus{padding:.65rem .75rem;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.gear-bonuses dt{color:var(--accent);font-weight:700}
.gear-bonuses dd{margin:0}
.gear-bonus-detail{margin-top:.45rem}
.gear-bonus-detail>summary{display:list-item;list-style:revert;padding:.35rem .1rem;cursor:pointer;color:var(--accent);font-size:.875rem;font-weight:600}
.gear-bonus-detail>summary::-webkit-details-marker{display:revert}
.gear-bonus-detail>summary::after{content:none}
.gear-effect{margin:.35rem 0}
.gear-parts{display:grid;gap:.8rem}
.gear-slot{display:grid;gap:.4rem;padding-top:.65rem;border-top:1px solid var(--line)}
#view .gear-slot-name{margin:0;font-size:.9rem;color:var(--muted);line-height:1.4}
.gear-set .gear-item:not([open])>summary::after{content:"+"}
.gear-item>summary{display:flex;align-items:center;gap:.7rem;padding:.65rem 2.45rem .65rem .7rem}
.gear-item>summary::after{top:50%;transform:translateY(-50%)}
#item-book-list{display:grid;gap:1.5rem}
#view:has(.item-book-layout){max-width:none}
.wrap:has(.item-book-layout){max-width:1200px}
:is(.item-book-layout,:where(#wiki-layout).has-wiki-rail){display:grid;grid-template-columns:clamp(170px,19vw,220px) minmax(0,1fr);align-items:start;gap:clamp(16px,2.4vw,28px)}
.item-book-main{min-width:0;container:item-results / inline-size;scroll-margin-top:calc(var(--masthead-height,70px) + 12px)}
:is(.item-book-sidebar,:where(#wiki-rail):not([hidden])){position:sticky;top:calc(var(--masthead-height,70px) + 12px);min-width:0;max-height:calc(100dvh - var(--masthead-height,70px) - 24px);display:flex;flex-direction:column;padding:.55rem;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
#view .item-book-sidebar h2{font-size:1rem;font-weight:700;text-align:left;margin:0;padding:.35rem .45rem .55rem}
#item-book-category{display:grid;gap:2px;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain}
.item-book-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.45rem;width:100%;min-height:36px;padding:.35rem .45rem;border:1px solid transparent;border-radius:5px;color:var(--fg);background:transparent;font:inherit;font-size:.875rem;text-align:left;overflow-wrap:anywhere;cursor:pointer}
.item-book-chip:hover,.item-book-chip[aria-pressed="true"]{background:var(--accent-soft)}
.item-book-chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.item-book-chip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item-book-count{color:var(--muted);font-size:.82rem;font-weight:500;white-space:nowrap}
.item-book-group-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.45rem .8rem;border-bottom:1px solid var(--line);margin-bottom:.65rem;padding-bottom:.45rem}
#view .item-book-group-head h2{display:flex;align-items:baseline;gap:.6rem;margin:0;font-size:1.25rem}
.item-book-group-head .skill-copy{margin:0}
.item-book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));align-items:start;gap:.65rem}
@container item-results (width < 49.3rem){
  .item-book-grid-preview>.item-book-card:nth-child(n+3){display:none}
}
@container item-results (width < 32.65rem){
  .item-book-grid-preview>.item-book-card:nth-child(n+2){display:none}
}

}
@container item-results (width >= 49.3rem){
  [data-preview-count="3"] .item-book-show-all{display:none}
}
.item-nav a:nth-child(2){margin-inline-start:.6rem}

.item-nav a{position:relative}
@media(max-width:720px){.item-nav a:nth-child(2){margin-inline-start:0;border-top:1px solid var(--line)}.item-nav a:nth-child(2)::before{content:none}}
.item-book-preview-title{margin:.75rem 0 .45rem;font-size:1rem}
.item-book-portraits{display:flex;flex-wrap:wrap;gap:.55rem .75rem}
.item-book-portraits figure{display:grid;justify-items:center;align-content:start;gap:.25rem;width:78px;margin:0;text-align:center;font-size:.8rem;line-height:1.25;overflow-wrap:anywhere}

<template id="t-basics">
  <h2>Новичку: прочитай один раз</h2>
  <details class="wiki-outline" open><summary>На этой странице</summary><nav aria-label="На этой странице"><ul><li><a href="#basics/exp-reading">Как читать гайд</a></li><li><a href="#basics/exp-terms">Слова, которые встретятся</a></li><li><a href="#basics/exp-difficulty">Сложности</a></li><li><a href="#basics/exp-reliability">Надёжность снаряжения - сколько нужно</a></li><li><a href="#basics/sphere-paradox">Сфера парадокса</a></li><li><a href="#basics/exp-checklist">Перед каждым заходом</a></li><li><a href="#basics/exp-reset">Сброс</a></li></ul></nav></details>
  <p class="lead">Экспедиции открываются через <b>Tab → Экспедиции</b>. Энергию не тратят, награда - раз в неделю. Перед первым заходом игра показывает подсказки по боссам.</p>
  <h3 class="sec" id="exp-reading">Как читать гайд</h3>
  <div class="legend"><span><span class="tag w">ВАЙП</span> - не выполнил, умирает вся группа</span><span><span class="tag f">огонь</span> / <span class="tag i">лёд</span> - стихия атаки</span><span><span class="tag src">Наблюдение игроков</span> - с форумов, в подсказках игры нет</span></div>
  <h3 class="sec" id="exp-terms">Слова, которые встретятся</h3>
  <dl class="gloss">
    <dt>Вайп</dt><dd>Вся группа умирает сразу. Почти всегда - наказание за невыполненную механику.</dd>
    <dt>Пробуждение (ульта)</dt><dd>Самое сильное умение. Часть щитов и бомб ломается <b>только им</b> или умением питомца - держи заряженным.</dd>
    <dt>Резонанс</dt><dd>Копится, когда бьёшь и когда бьют тебя. Снимает с тебя контроль. Не трать впустую.</dd>
    <dt>«Второе дыхание»</dt><dd>Выход из оглушения/захвата за энергию.</dd>
    <dt>Надёжность снаряжения</dt><dd>Показатель твоего снаряжения. У каждого босса экспедиции свой порог - он написан внизу окна экспедиции (например «1500 Надёжность снаряжения»). Ниже порога - по тебе в бою всё время идёт урон. Растёт от рейдового снаряжения и его улучшения.</dd>
  </dl>
  <h3 class="sec" id="exp-difficulty">Сложности</h3>
  <div class="tbl"><table>
    <tr><th>Сложность</th><th>Игроков</th><th>Пропусков</th><th>Чем отличается</th></tr>
    <tr><td><b>Одиночный</b></td><td>1</td><td>меньше всего</td><td>Учебный режим, награда ниже. Порог надёжности как на сюжете.</td></tr>
    <tr><td><b>Сюжет</b></td><td>2-4</td><td>средне</td><td>Все механики, обычная награда.</td></tr>
    <tr><td><b>Героический</b></td><td>4-8*</td><td>больше</td><td>Порог надёжности выше, боссы сильнее.</td></tr>
    <tr><td><b>Легендарный</b></td><td>4-8*</td><td>больше</td><td>Самый высокий порог и лучшая награда.</td></tr>
  </table></div>
  <p class="sub" style="margin:-8px 0 16px">* Исключения: Логово Воронова крыла - 2-4 игрока; Темница разума - героический и легендарный ровно 8; Литургия стужи - сюжет и героический ровно 4. Вход: одиночный 4 пропуска, сюжет 6, героический и легендарный 10. У каждого босса: ежедневная награда 1 раз, недельная - 3 раза.</p>
  <h3 class="sec" id="exp-reliability">Надёжность снаряжения - сколько нужно</h3>
  <p class="sub" style="margin:0 0 10px">Твоя надёжность должна быть не ниже числа - тогда пройдёшь всех боссов. Список идёт от лёгких к сложным.</p>
  <div class="tbl"><table>
    <tr><th>Экспедиция</th><th>Одиночный</th><th>Сюжет</th><th>Героический</th><th>Легендарный</th></tr>
    <tr><td><b>Шах и мат</b></td><td>4500</td><td>4500</td><td>5000</td><td>5000</td></tr>
    <tr><td><b>Ход королевы</b></td><td>5000</td><td>5000</td><td>5000</td><td>5000</td></tr>
    <tr><td><b>Храм судьбы</b></td><td>5500</td><td>5500</td><td>6000</td><td>6000</td></tr>
    <tr><td><b>Последнее откровение</b></td><td>5800</td><td>5800</td><td>6300</td><td>6300</td></tr>
    <tr><td><b>Логово Воронова крыла</b></td><td>6500</td><td>6500</td><td>7000</td><td>7200</td></tr>
    <tr><td><b>Хребет исполина</b></td><td>6800</td><td>6800</td><td>7200</td><td>7400</td></tr>
    <tr><td><b>Сокрытое сердце</b></td><td>7000</td><td>7000</td><td>7400</td><td>7600</td></tr>
    <tr><td><b>Литургия стужи</b></td><td>7000</td><td>8000</td><td>9800</td><td>нет</td></tr>
    <tr><td><b>Предел погружения</b></td><td>7800</td><td>7800</td><td>8200</td><td>8400</td></tr>
    <tr><td><b>Темница разума</b></td><td>8000</td><td>8000</td><td>8400</td><td>8600</td></tr>
  </table></div>
  <h3 class="sec" id="sphere-paradox"><a class="item-heading" href="#itembook/310355"><img src="img/items/13059.webp" alt="" width="38" height="38" loading="lazy">Сфера парадокса</a></h3>
  <div class="callout tip"><b>Где получить:</b> «Темница разума» или «Литургия стужи» при наличии доступных наград. В описании предмета указаны сюжетная, героическая и легендарная сложности и условие: <b>боевая мощь не ниже 60 000</b>. Сфера позволяет выбрать один из предлагаемых предметов для быстрого прохождения экспедиций.</div>
  <h3 class="sec" id="exp-checklist">Перед каждым заходом</h3>
  <ol class="check">
    <li><div><b>Проверь надёжность снаряжения</b> - порог написан внизу окна экспедиции у каждого босса. Не хватает - бери сложность ниже.</div></li>
    <li><div><b>Еда:</b> +8% защиты, +8% атаки, еда на свою стихию. <b>Эликсир мастера</b> удваивает материалы.</div></li>
    <li><div><b>Наставник в группе:</b> крит +10%, крит. урон +5%.</div></li>
    <li><div><b>Роли до боя:</b> кто водит, кто ломает, кто несёт. У каждого босса ниже есть «Кратко».</div></li>
    <li><div><b>Новый бой:</b> сначала соло, потом сюжет, потом легендарный.</div></li>
  </ol>
  <h3 class="sec" id="exp-reset">Сброс</h3>
  <div class="tbl"><table>
    <tr><th>День</th><th>Экспедиции</th></tr>
    <tr><td><b>Понедельник</b></td><td>Королевский гамбит · Темница разума · Логово Воронова крыла · Сокрытое сердце</td></tr>
    <tr><td><b>Четверг</b></td><td>Предел погружения · Литургия стужи · Капсула памяти (Храм судьбы, Последнее откровение) · Хребет исполина</td></tr>
  </table></div>
</template>

<template id="t-gearbook">
  <h1>Комплекты и оружие</h1>
  <p class="lead">Снаряжение 75-го и 80-го уровней, бонусы комплектов и оружие по специализациям. <a href="#gear/b-where">Где добывать снаряжение</a></p>
  <div class="gear-class-choice">
    <label for="gear-book-class">Твоя специализация
      <select id="gear-book-class"><option value="">Выбери специализацию</option></select>
    </label>
    <a id="gear-book-class-skills" href="#skillbook" hidden>Умения специализации</a>
    <p>Пилигрим идёт первым как стартовый комплект. Выбор класса подбирает оружие и показывает советы по комплектам. Можно собрать любой комплект.</p>
    <p><strong>Как мы подбираем экипировку.</strong> Рекомендации по классам основаны на внутриигровых описаниях умений, бонусов комплектов и эффектов оружия. Мы смотрим, какие бонусы сочетаются с механиками класса и насколько удобно активировать их в бою. Это общие рекомендации. Лучше самому проверить в бою, какие связки подходят твоей сборке и стилю игры.</p>
  </div>
  <details class="wiki-outline" open><summary>На этой странице</summary><nav aria-label="Разделы снаряжения"><ul>

  <template id="gear-book-path">
    <section>
      <h2>От гроссмейстера до Абсолюта</h2>
      <ol>
        <li>Собери <b>Фигуру Кровавой королевы</b> из двух осколков. Активируй её и пройди <a href="#queen">«Ход королевы»</a> на сюжетной или героической сложности для задания «Путь нового короля». Награда - <b data-grandmaster></b>.</li>
        <li>В <a href="#depth">«Пределе погружения»</a> добудь <a href="#prayer/b-pr_depth">два Колокола просветления</a>. Сделай <b>Абсолютное осознание</b> за 2 000 Дезириумов Тьмы при наличии оружия гроссмейстера или за 8 000 без него.</li>
        <li>Активируй Абсолютное осознание. Пройди «Предел погружения» на сюжетной или героической сложности по заданию «Пробуждение разума». Награда - <b data-absolut></b> 70-го уровня.</li>
        <li>Алчный Абсолют 75-го уровня делается из Абсолюта 70-го уровня, 500 жетонов неизвестного воина, 100 хитиновых дезириумов и 20 млн золота.</li>
        <li>Из Алчного Абсолюта сделай вечный Абсолют 80-го уровня. Для рецепта нужны 5 Венцов адского пламени, 120 Углей вознесения и 20 млн золота. Оба материала добываются в <a href="#liturgy">«Литургии стужи»</a>.</li>
      </ol>

     ['<b>Интеллект</b>','<b>Сила заклинаний</b> (маг. урон)','<b>Маг. классы</b>'],
     ['<b>Ловкость</b>','Защита + <b>шанс физ. крита</b>','<b>Физ. классы</b>'],
     ['<b>Сила духа</b>','Сопротивление + <b>шанс маг. крита</b>','<b>Маги</b>'],
     ['Стойкость','Базовое здоровье','Всем'],
     ['Доблесть','Меньше урона от игроков в Арканитовом лабиринте, Запретной зоне, Большом куше и на Дороге славы','PvP']])+'<p><b>Как узнать свой тип урона:</b> открой подсказку любого умения. «Физический урон» - качай Силу и Ловкость. «Магический урон» - Интеллект и Силу духа. Ещё проще: в «Характеристиках» сравни силу атаки и силу заклинаний - у твоего класса одна из них намного больше. Стойкость нужна всем.</p><p>Есть универсальные вещи (например, шлем «универсальные доспехи» даёт и Силу, и Интеллект) - они подходят любому классу.</p>'),
   S('g_desc2','Основной блок','<b>Сила атаки</b> (физ. классы) / <b>сила заклинаний</b> (маги) - базовый урон: урон умения = <b>множитель умения × сила атаки или заклинаний</b>. <b>Прорыв защиты / сопротивления</b> - дополнительный урон, который игнорирует защиту врага. <b>Защита / сопротивление</b> - режут получаемый урон.'),
   S('g_desc4','Крит, скорость, сноровка','<b>Шанс физ. / маг. крита</b> (смотри свой тип) - как часто крит. <b>Крит. урон</b> - во сколько раз сильнее крит (например, 190% - крит почти вдвое сильнее обычного удара). <b>Скорость атаки</b> - быстрее атаки и умения. <b>Сноровка</b> - умения быстрее откатываются (меньше КД).'),
   S('g_desc5','Стихия','Бонус к ледяному / огненному / электрическому / <b>астральному</b> урону и устойчивость к ним. Стихию умения видно в его теге в Esc → Умения (например, «Астрал»). Качай бонус к той стихии, которой бьют твои основные умения.'),
   S('g_desc6','Дополнительные','Бонус к урону, к урону базовой атаки, <b>к урону умений</b>, игнорирование защиты / сопротивления (% брони врага, который не считается), восстановление и урон резонанса, пробивание щита, <b>урон по боссам</b>.'),
   S('g_desc7','Бонусы против типов врагов','Урон по механизмам, заражённым, потусторонним существам, <b>по ослабленным целям</b> (на которых висят дебаффы), бонус от снаряжения, питомца и арретира. Видно, откуда приходит каждый процент.')]},
 {id:'skills',name:'Умения и урон',who:'Персонаж → Умения; Esc → Умения',must:['Урон умения = % × сила атаки / заклинаний','Сравнивай умения по % в подсказке','2-й ряд работает только после 1-го'],
  steps:[S('g_skills','Персонаж → Умения → «Боевые»','4 ячейки, в каждой 2 умения (верхний и нижний ряд), и <b>сверхспособность</b> (L Shift). Цифра на иконке - уровень умения.<p><a href="#skillbook/warlock">Умения Чернокнижника в справочнике</a></p>'),
   S('g_skill_tip','Клик по умению - сколько оно бьёт','Пример: «Наносит магический урон <b>1282%×8</b> от базового» - 8 ударов, каждый по 1282% от силы заклинаний (у физ. классов - от силы атаки). Например, при силе заклинаний 26 000 это ≈ 333 000 за удар до крита и бонусов. «Следующий уровень» показывает, сколько добавит ап.'),
   S(null,'Как примерно считается урон','<b>Сила атаки или заклинаний × % умения</b>, дальше бонусы умножаются: к урону умений, к стихии, по боссам / ослабленным, крит (× крит. урон), минус защита врага (её режут прорыв и игнорирование). Точную формулу игра не показывает, порядок примерный.','s'),
   S(null,'Пассивные умения','Пассивные умения действуют после изучения и не занимают боевую ячейку. На вкладке «Пассивные» цифра на иконке показывает уровень.<ul class="wiki-items" aria-label="Примеры пассивных умений Чернокнижника"><li><img src="img/coa-rest-in-peace.webp" alt="" loading="lazy">Вечный покой</li><li><img src="img/coa-apostle-flight.webp" alt="" loading="lazy">Полёт Апостола</li></ul>'),
   S('g_skilltree','Esc → Умения: дерево умений','Сверху <b>очки умений</b>. Справа отдельные наборы <b>PvE / PvP</b>, теги умения (Боевое, Астрал, «Пробивание обычной брони») и видео. «16/10» и зелёное «(+6)» - уровень выше обычного максимума за счёт бонусов. Кнопки: <b>Понизить уровень</b> (вернуть очки), <b>Улучшение</b>, <b>Установить в ячейку</b>. Внизу пресет «ПВЕ» и «Сбросить».'),
   S('g_skillrules','Правила умений','Активное умение надо изучить и поставить в ячейку. Пассивное работает сразу. <b>Умение во втором ряду можно применить только после умения из той же ячейки первого ряда.</b> Класс можно сменить до пробуждения I ступени, после классового задания и за <b>кристалл альтерации</b> - Магазин → Предмет → Усиление, 1000 кристаллов / призмадия, не больше 2 в месяц.','wd')]},
 {id:'slang',name:'Словарик игроков',who:'чат и гайды',must:['БМ, ГС, надёжка','КД, ДПС','баф / дебаф'],
  steps:[S(null,'Слова, которые пишут в чате',T([['Слово','Значит'],
     ['БМ','Боевая мощь'],['ГС','Рейтинг экипировки (gear score)'],['Надёжка','Надёжность снаряжения'],
     ['КД','Время восстановления умения (кулдаун)'],['ДПС','Урон в секунду или тот, кто его наносит'],
     ['Баф / дебаф','Усиление на себе / ослабление на враге («ослабленные цели»)'],
     ['Вайп','Вся группа погибла'],
     ['Ролл / перекат','Перебросить случайные строки (арретир)']]))]}]},
{id:'classes',tab:'Классы и умения',title:'Классы и умения',
 chips:['7 базовых классов','19 специализаций'],
 lead:'В «Кристалле Атлана» семь базовых классов. На 15-м уровне открывается выбор специализации. Открой карточку, чтобы узнать, как устроен её бой. Полные списки собраны в <a href="#skillbook">справочнике умений</a>. В игре описания и различия между PvE и PvP находятся в меню <b>Esc → Умения</b>.',

{id:'start',tab:'С чего начать',title:'План прокачки',
 chips:['от новичка до 80','порядок важен'],
 lead:'До 70-го уровня проходи сюжет и открывай сундуки со снаряжением по мере прокачки. После 70-го уровня добавь в ежедневный маршрут Обитель распада III и контракты.\n\nМеню <b>Esc</b> открывает окна снаряжения и других систем.',

  steps:[S('p_menu','Меню Esc','Отсюда всё: <b>Снаряжение</b>, Умения, Питомцы, Флотилия, <b>Аукцион</b>, <b>Биржа</b>, Рейтинг, Достижения, Исследование, <b>Атландекс</b>, Транспорт, Наставничество.','','Если кнопка не нажимается - зажми Alt и кликни дважды.'),
   S('p_dev_boost','Снаряжение → «Развитие» → Усиление','Тут видно, что у тебя слабее всего: Снаряжение, Закалка, Арретир, Гравировки, Питомцы - с боевой мощью и процентом игроков, которых ты обогнал. <b>Качай то, где процент ниже</b>. Кнопка «Повысить» ведёт в нужное окно.'),
   S('p_dev_adv','Развитие → Приключения','Прогресс по контенту: какие экспедиции пройдены и на какую оценку. Кнопка «Перейти» сразу открывает нужный режим.'),
   S(null,'Уровни 1-70','Иди по сюжету: он даёт уровень. Снаряжение выдаёт <b>сундук, который открывается по уровню</b> - в нём сразу хорошие вещи под твой уровень. На <b>75 и 80</b> уровне из него приходит <b>сет пилигрима</b>.<ul class="wiki-items"><li><a href="#gearbook/sets/56235"><img src="img/coa-pilgrim-box.webp" alt="" loading="lazy">Комплект пилигрима</a></li></ul>'),
   S(null,'Не хватает 5 уровней для сюжета','Сюжет даёт только <b>65</b> уровень. Недостающие 5 выфармите в Обители <b>текущего</b> уровня или в последнем доступном легендарном данже (самом последнем в сюжете). Сами данжи требуют определённого уровня <b>Надёжности</b>. Недостающее снаряжение всегда можно скрафтить или докупить на аукционе (например, на твинков).'),
   S(null,'70+ и дальше','Каждый день зелёная энергия в <b>Обитель распада III</b> и контракты. Собрал эпики 75 - закалка, руны, арретиры. Потом экспедиции, вещи 80 и гравировки.<ul class="wiki-items"><li><a href="#energy/s-en-2"><img src="img/coa-battery-pack.webp" alt="" loading="lazy">Батарейный блок и другие способы восстановить энергию</a></li></ul>')]}]},
{id:'energy',tab:'Энергия',title:'Энергия и фарм',
 chips:['сброс в 06:00','4 вида энергии'],
 lead:'Энергия тратится на Обитель распада, сюжет и контракты. Экспедиции её не тратят. Каждая потраченная <b>зелёная</b> энергия тратит столько же <b>оранжевой</b>. Подробнее о том, как всё устроено, открой окно энергии, нажав на неё в игре.',
 bosses:[{id:'en',name:'Как устроена энергия',who:'каждый день',must:['Сначала зелёная - полная награда','Неистраченное уходит в резерв','Батареи - дополнительная энергия'],
  steps:[S(null,'Окно энергии (иконка слева вверху)','<b>Обычная 140</b> (зелёная, у каждого персонажа своя) и её резерв 140, <b>общая 840</b> (на аккаунт) и её резерв 840. Восстанавливается в 06:00.'),
   S(null,'Какую тратить','<b>Обычная</b> - полная награда. Кончилась - тратится общая: награда меньше, в Обители нет эпиков и не растёт гарантия.','w'),
   S('energy','Батареи','Батарея +5 (10/день), блок +10 (2/день), массив +20 (1/день), каскад +30 (2/день, 150 кристаллов / призмадия, 14 в неделю).','d'),
   S(null,'Охотничьи ордера','Умножают награду в Обители. Батареи выгоднее тратить именно в такие заходы. Заход - 15-25 секунд, если бить пачку умениями.')]}]},

{id:'gear',tab:'Снаряжение',title:'Снаряжение',
 chips:['эпики 75','вечные 80','авторазбор'],
 lead:'12 ячеек: оружие, 5 доспехов, 6 украшений. Каждая вещь качается отдельно: закалка, калибровка, руны, арретир, гравировки. <a href="#gearbook">Посмотреть комплекты и оружие 75-го и 80-го уровней</a>.',
 bosses:[
 {id:'eq',name:'Окно снаряжения',who:'Esc → Снаряжение',must:['Вкладки: Снаряжение, Арретир, Костюмы, Колода','Клик по вещи - меню прокачки','Внизу «Развитие» - что качать'],
  steps:[S('p_equip','Esc → Снаряжение','Слева вкладки <b>01 Снаряжение, 02 Арретир, 03 Костюмы, 04 Колода</b>. Вокруг персонажа 12 ячеек. Справа сумка, кнопки «Разобрать» и «Изготовить».'),
   S('p_item','Клик по вещи','Подсказка: уровень, рейтинг, основные статы и их % (потенциал), закалка и звёзды пробуждения, руны. Справа меню: <b>Закалка, Калибровка, Гравировки, Руны</b>.'),
   S('rel_extra','«Надёжность снаряжения» в блоке «Дополнительные характеристики»','Зелёная строка внизу подсказки вещи, ниже основных характеристик. Повышается при улучшении снаряжения. Сумма по всем вещам - твоя надёжность (Персонаж → Заслуги); у каждой экспедиции есть порог.','w')]},
 {id:'where',name:'Где брать вещи',who:'',must:['Эпики 75 - Обитель распада III (гарантия каждые 12)','Атландекс показывает, где что падает и что крафтится','Ставь авторазбор на всё ниже эпика'],
  steps:[S(null,'Обитель распада III','Эпик 75: 3% за заход, <b>гарантия каждые 12 заходов</b>. Вечные 80: 0,1%. <b>Молитва</b>: дезириум поднимает шанс нужной вещи (броня до 100 шт., оружие до 500); Молитва Вечности - до 1000, потом выбираешь вечную вещь.'),
   S('p_atl_gear','Esc → Атландекс → Снаряжение','Каталог всех вещей: фильтры по уровню, качеству, типу, классу. Справа описание, <b>материалы и кнопка «Изготовить»</b>.'),
   S('p_bag','Сумка (B)','Внизу золото, «Склад» (общий на аккаунт) и «Разобрать».'),
   S('p_dismantle','«Разобрать» → авторазбор','Отметь качества и включи <b>«Разбирать автоматически»</b>. Обычно ставят всё ниже эпика. <b>Эпики не отмечай</b> - их можно продать или скормить.','','Не разбирай всё подряд: часть вещей и материалов дороже на аукционе. Сначала глянь цену.')]}]},
{id:'prayer',tab:'Молитвы',title:'Молитвы: как выбить нужную вещь',
 chips:['Обитель распада III','Предел погружения','3 вида молитвы'],
 lead:'Молитва повышает шанс получить <b>конкретную вещь внутри категории</b>. Общий шанс выпадения категории остаётся прежним.\n\nВ <b>Обители распада III</b> за молитву тратят <b><a href="#itembook/361773">Хитиновый дезириум</a></b>. Там доступны молитвы на эпическое снаряжение 75-го уровня и <a href="#prayer/b-pr_eternal">«Молитва вечности»</a> на вечное снаряжение 80-го уровня. В <b>«Пределе погружения»</b> есть <b>Безмолвный колокол просветления</b> за Дезириум Тьмы.\n\n<a href="https://www.youtube.com/watch?v=-GjUyM1C-AI" target="_blank" rel="noopener">Видео о механике молитв от Chezuget</a>.',
 bosses:[
 {id:'pr_how',col:'#f59e0b',dg:'Обитель распада',name:'Как работают',who:'Tab → Приключения → Обитель распада',must:['Обещаешь дезириумы - шанс растёт','Не выпало - дезириумы не тратятся','Выпало - обещанные сгорают, лишние сверх максимума возвращаются'],
  steps:[S('pr_where','Где кнопки','Tab → Сражения → Приключения → <b>Обитель распада</b>. Справа две кнопки: <b>«Молитва»</b> (эпическое снаряжение 75) и <b>«Молитва Вечности»</b> (вечное снаряжение 80). Платишь <b>Хитиновым дезириумом</b> (аукцион, ~55 тыс. золота).'),
   S('pr_main','Окно «Молитва» (эпик 75)','Слева выбери класс и вещь. В центре: во сколько раз увеличен шанс, <b>счётчик попыток</b> и сколько дезириумов обещано (например 9/100). Кнопка «Молитва» - обещать ещё.'),
   S('pr_promise','Обещать дезириумы','Каждый дезириум: обычная молитва <b>+0,2 к множителю</b>, вечная <b>+0,01</b>. Формула: базовый шанс × (1 + шаг × число дезириумов). У каждой молитвы есть максимум - сверх него шанс не растёт.'),
   S(null,'Счётчик попыток (гарантия)','Если вместо нужной вещи выпала <b>другая</b> вещь того же качества, в счётчик добавляется число обещанных дезириумов. Счётчик дошёл до предела - нужная вещь выпадает гарантированно. Поэтому чем больше обещано, тем быстрее гарантия.','w'),
   S(null,'Резервная энергия не считается','Если рядом с прогрессом написано «Используемая резервная энергия не учитывается», награды с этой энергии не двигают молитву, не пополняют счётчик и не могут дать вечную вещь. Молись на <b>обычной (зелёной)</b> энергии.','w')]},
 {id:'pr_table',col:'#f59e0b',dg:'Обитель распада',name:'Шансы и гарантии',who:'одна таблица на обе молитвы',must:['Эпик 75: 100 дезириумов = гарантия за 7 лишних эпиков','Эпик-оружие: 500 дезириумов, 10 эпиков','Вечное 80: целевая 1000 = гарантия за 32 прохода'],
  steps:[S(null,'Все цифры в одном месте',T([['Что молишь','Базовый шанс','Макс. дезириумов','Шанс на максимуме','Гарантия без дезириумов','Гарантия на максимуме'],
    ['Эпик 75: шлем, доспех, поножи, перчатки, обувь, ожерелье, наручи, кольцо, печать, талисман','0,728% от эпик-дропа','100','15,29%','700 эпиков','7 эпиков'],
    ['Эпик 75: оружие','0,106% от эпик-дропа','500','10,69%','5000 эпиков','10 эпиков'],
    ['Вечное 80: случайная вещь','0,1% за проход','1-999','до ~0,2%','200 000','201 проход'],
    ['Вечное 80: целевая (выбранная вещь)','0,1% за проход','1000','~0,2%','200 000','<b>32 прохода</b>']])+'<p>Эпик 75 вообще падает с шансом <b>3% за проход</b> Обители III, плюс гарантированный эпик <b>каждые 12 проходов</b>. Значит, с 100 дезириумами нужная бижутерия или доспех приходит максимум через 7 «лишних» эпиков, то есть примерно за 84 прохода.</p>')]},
 {id:'pr_eternal',col:'#f59e0b',dg:'Обитель распада',name:'Молитва вечности (вечное 80)',who:'Обитель распада → Молитва вечности',must:['Внеси 1000 дезириумов - откроется целевая молитва','Выбираешь конкретную вещь','Уже выпавшие вечные вещи не повторяются'],
  steps:[S('pr_eternal','Окно «Молитва вечности»','По кругу вещи <b>реликварного</b> качества (доспехи и украшения; надеть можно по одной каждого вида). Счётчик «Совершено попыток 2 900/200 000». Внизу «Внесено 100/1000».'),
   S(null,'Целевая молитва','Когда обещано <b>1000</b> дезириумов, открывается особая молитва: выбираешь <b>конкретную вечную вещь</b>, и при следующем выпадении вечного снаряжения придёт именно она. Гарантия наступает за 32 прохода.','w'),
   S(null,'Правило уникальности','Каждая выпавшая вечная вещь фиксируется и не выпадает снова, пока не соберёшь всё доступное вечное снаряжение. Потом история обнуляется.')]},
 {id:'pr_tips',col:'#f59e0b',dg:'Обитель распада',name:'Что выгоднее',who:'советы',must:['Сначала бижутерия триединства и доспехи (100 дезириумов)','Оружие дорого: 500 дезириумов','Вечное - копи на целевую 1000'],
  steps:[S(null,'Порядок','<b>1.</b> Вещи за 100 дезириумов: максимальный шанс 15,29% и гарантия за 7 эпиков - это дешевле всего. <b>2.</b> Оружие только если очень нужно: 500 дезириумов (~27 млн золота). <b>3.</b> Вечное: случайная молитва почти бесполезна, копи сразу на <b>целевую 1000</b>. Обещай дезириумы до максимума: лишнее сверх максимума вернётся.','s')]},
 {id:'pr_depth',col:'#8b5cf6',dg:'Предел погружения',name:'Безмолвный колокол просветления',who:'Экспедиции → Предел погружения → «Молитва»',must:['Платишь Дезириумом Тьмы, не хитиновым','Цель - Безмолвный колокол просветления','8000 дезириумов дают доп. бонус к шансу'],
  steps:[S(null,'Шансы',T([['Трофей','Базовый шанс','Макс. дезириумов','Шанс на максимуме','Гарантия без дезириумов','Гарантия на максимуме'],['Безмолвный колокол просветления','0,04%','8000','12,84% (на 7999) + бонус на 8000','48 000','6-7 уникальных трофеев']])),
   S(null,'Как работает','Tab → Сражения → Экспедиции → Предел погружения, кнопка <b>«Молитва»</b> справа. Подношение - <b>Дезириум Тьмы</b>: каждый +4% к шансу (базовый шанс × (1 + 0,04 × число)). На <b>8000</b> обещанных - дополнительный бонус. В любом режиме уникальный трофей (мыслецвет, колокол) выпадает с шансом 25%, гарантированно - за 3 вытянутые карты. Каждый уникальный трофей не тот, что нужен, добавляет в счётчик число обещанных дезириумов. Если в подземелье желаемый трофей не падает, молитва там не действует.')]},
]},
{id:'calib',tab:'Калибровка',title:'Калибровка',
 chips:['меню вещи → Калибровка','Обычная / Тонкая'],
 lead:'Калибровка перекатывает основные статы вещи в их диапазоне. «Потенциал %» - насколько статы близки к максимуму.',
 bosses:[{id:'c',name:'Как калибровать',who:'',must:['Обычная - все строки случайно (могут упасть)','Тонкая - повышает одну строку','До 70% - Обычная, после - Тонкая'],
  steps:[S('p_calib','Окно калибровки','Слева вещи с % калибровки, в центре потенциал, справа строки и их максимум. Внизу режим и цена материалов.'),
   S('p_calib_fine','Режим «Тонкая»','«Показатель одной характеристики повысится на случайное значение». Ничего не падает - безопасно.','',"Пока вещь ниже ~70%, дешевле крутить «Обычную». Выше 70% - только «Тонкую», чтобы не потерять (совет игроков)."),
   S(null,'Что калибровать первым','То, что носишь долго: оружие и вещи 75-80. Вещи, которые скоро сменишь, не трогай.','s')]}]},
{id:'temper',tab:'Закалка',title:'Закалка',
 chips:['до +10 - в рюкзаке','выше - у Мастера Гленна','до +25'],
 lead:'Закалка поднимает защиту, сопротивление и надёжность снаряжения. Самый большой рост силы. Только ПВЕ-снаряжение. <a href="#temper/b-t-spray">Напыление</a> даёт временный уровень закалки. <a href="#calculators/calc-temper">Рассчитать стоимость закалки</a>. <a href="#currency/s-cur_gift-2">Где взять общий эскиз +14</a>.',
 bosses:[
 {id:'t1',name:'Как закаливать',who:'',must:['До +11 неудача ничего не отнимает','+11…+15: неудача −1 уровень','С +15: счётчик защиты - гарант на 7-й попытке'],
  steps:[S('p_temper','Окно закалки (у Мастера Гленна в Рейнсе)','До +10 - прямо из рюкзака. Выше - подойди к <b>Мастеру Гленну</b> (кнопка «Закалка» в меню вещи сама проложит путь). Внизу вещи, справа: статы до/после, материалы, <b>слот катализатора</b>, шанс, цена, «ЗАКАЛИТЬ».'),
   S(null,'Пределы','Уникальные и выше от 55 ур. - до <b>+25</b>, остальные - до +15. После закалки вещь персональная. Лимит - 30 000 улучшений в день.'),
   S(null,'Неудача','До +11 штрафа нет. На +11…+15 уровень <b>падает на 1</b>. После +15 уровень не падает, но прогресс пробуждения обнуляется.','w'),
   S('p_temper_table1','Счётчик защиты от неудач','С первой неудачи на +15 каждая следующая попытка получает больше шанса, <b>7-я - 100%</b>:'+T([['Уровень','1','2','3','4','5','6','7'],['+15','18%','22%','26%','30%','40%','50%','100%'],['+16','16','20','25','30','40','50','100'],['+17','14','19','24','30','40','50','100'],['+18','12','18','24','30','40','50','100'],['+19','11','17','23','30','40','50','100'],['+20','10','15','20','25','35','50','100'],['+21','8','13','19','25','35','50','100'],['+22','6','10','15','20','30','50','100'],['+23','4','8','12','18','25','50','100'],['+24','2','4','8','12','25','50','100']]))]},
 {id:'t2',name:'Пробуждение, артефакт, катализаторы',who:'после +15',must:['После +15 - бронзовые звёзды','Артефакт выше +18 требует резонанс','Мощные катализаторы - на +13…+15'],
  steps:[S(null,'Пробуждение («бронзовые звёзды»)','Нужно звёзд: +15…+17 - <b>3</b>, +18…+19 - <b>4</b>, +20…+21 - <b>5</b>, +22…+25 - <b>6</b>. Каждый этап - не больше 7 попыток. Успешная закалка сбрасывает прогресс пробуждения на случайное значение, неудачная - обнуляет.'),
   S(null,'Артефакт выше +18','Нужен уровень резонанса: +18→19 - 150, →20 - 170, →21 - 190, →22 - 200, →23 - 210, →24 - 220, →25 - 230. Резонанс = сумма закалки всего снаряжения.'),
   S(null,'Катализаторы','Обычный +4% шанса. 2 обычных → стабильный (не даёт откатиться ниже +12). Мощный +7% - на +13…+15. 10 мощных → катализатор усиления, гарантирует 3-ю звезду пробуждения. В магазине: стандартный 100, мощный 800 кристаллов / призмадия.','sd','До +11 закаливай без катализаторов. На +12 - стабильные, на +13…+15 - мощные. Откатился - возвращайся со стабильным.'),
   S(null,'Порядок закалки','Оружие → печать и талисман → шлем, перчатки, сапоги. Сначала всё до +12, потом всё до +13, потом оружие до +15.','s','Без доната выше +15 тянуть дорого - одна попытка стоит сотни тысяч золота.')]},
 {id:'t-spray',name:'Напыление',who:'временная закалка',must:['С 15-го дня после открытия сервера','Снаряжение от 55-го уровня, уникальное или выше','Рассеивается в 06:00 на восьмой день после нанесения'],
  steps:[S('temper-spray-requirements.png','Что даёт напыление','<p>На время действия применяется уровень закалки, полученный от напыления. Исходный уровень с ним не складывается. Прибавка к характеристикам немного ниже, чем при обычной закалке.</p><p>На артефактах напыление повышает характеристики. Резонанс для повышения уровня артефакта рассчитывается без этого бонуса.</p>'),
   S('temper-spray-duration.png','Срок, отключение и ограничения','<p>Напыление рассеивается в <b>06:00 на восьмой день после нанесения</b>. До этого его можно отключить и снова включить в описании предмета.</p><p>Напыление и проекция на одной вещи несовместимы. В испытаниях тотализатора <cite>«Золотого руна»</cite> напыление не учитывается. Часть золота за нанесение перечисляется в фонд закалки.</p>')]},
 {id:'t3',name:'Перенос закалки (переработка)',who:'',must:['Стандартная - старая вещь исчезает','Проекционная - старая остаётся, но обнуляется','Руны и передаваемые гравировки переносятся'],
  steps:[S(null,'Стандартная переработка','Старая вещь <b>исчезает</b>. Одинаковое качество и уровень - закалка переносится без потерь. Если старая хуже - итог ниже, пробуждение обнулится.','w'),
   S(null,'Проекционная переработка','Только эпики 55-80. Старая вещь <b>остаётся</b>, но её закалка, пробуждение и счётчик обнуляются. На вещь 60+ можно перенести с любого эпика 55-80. Если старая вещь того же уровня или выше - нужно 1 <b>Проекционное ядро</b>.'),
   S(null,'Что переносится ещё','Передаваемая гравировка (если на новой пусто), руны (руны с новой уходят в рюкзак), проекция. После переработки вещь какое-то время нельзя положить на склад.')]}]},
{id:'arretir',tab:'Арретиры',title:'Арретиры',
 chips:['1 на ячейку','до 30 ур.','вечные строки'],
 lead:'Арретир - вставка в ячейку, а не в вещь: при смене вещи он остаётся. Даёт основную строку, доп. строки, а вечный - ещё 4 вечные.',
 bosses:[
 {id:'a1',name:'Где и как качать',who:'Снаряжение → 02 Арретир',must:['Корм - «Улучшить несколько»','Эпический: 4 доп. строки, прорывы на 20/22/24/27','Не корми арретир, пока не видишь его строки'],
  steps:[S('p_arr','Вкладка «02 Арретир»','Слева 12 ячеек, в центре арретир выбранной ячейки, справа сумка арретиров. Внизу <b>«Улучшить несколько»</b> - скормить лишние.'),
   S('p_arr_tip','Клик по арретиру','Основная строка, доп. строки, вечные строки. Меню: <b>Улучшение, Преобразование, Интеграция</b>.'),
   S('arr_base','Развитие → Основные: звёздочки','Звёздочкой отмечены приоритетные характеристики: <b>Интеллект</b> и <b>Сила духа</b>. Ориентируйся на них, когда выбираешь, что качать в арретире.'),
   S('arr_attack','Развитие → Нападение: звёздочки','Звёздочкой отмечены <b>Шанс магического крит. удара</b> и <b>Прорыв сопротивления</b>. Для магического класса эти строки важнее остальных.'),
   S(null,'Класс: тип урона и доспехов','Во вкладке «Класс» видно тип доспехов, оружие и <b>вид урона</b> (у Чернокнижника: магический, астральный). Арретир под этот вид урона и подбирай строки.'),
   S('p_arr_up','Улучшение','Слева корм (лишние арретиры и детали, «Быстрый выбор»), справа уровень и строки.'),
   S('p_arr_up_rules','Правила улучшения','Доп. строк: обычный 1, необычный 2, редкий и уникальный 3, эпический 4. Каждые 2 уровня - новая строка; когда все открыты, каждые 2 уровня случайно растёт одна из них.'),
   S(null,'Прорывы и вечный арретир','Эпический после 20 ур. делает прорывы на 20, 22, 24, 27 - каждый открывает вечную строку и требует <b>сердечник арретира</b>. Бесплатно - за жетоны флотилии, в гильдии комиссионеров, из ларца «Вечные ценности»; в магазине - 90 кристаллов / призмадия. На 30 ур. - вечный IV.')]},
 {id:'a2',name:'Преобразование (перекат вечных строк)',who:'после 4-го прорыва',must:['Попытки ограничены и дорожают','Предохранители сохраняют нужные строки','Урон от арретира - самая редкая строка (1,49%)'],
  steps:[S('p_arr_reroll','Окно «Переработка арретира»','4 вечные строки, у каждой <b>диапазон</b> (например 0,6-1,0%) и <b>замок</b>. Внизу «Осталось попыток», <b>Предохранитель</b> и цена в сердечниках.'),
   S(null,'Правила','Меняет вид и вечные строки. Нужны сердечники (можно заменить золотыми монетами). Чем больше строк закрываешь, тем больше предохранителей. <b>Каждая попытка дороже, число попыток ограничено.</b> Предохранитель и сердечники продаются в магазине (500 и 90 кристаллов / призмадия).','wd'),
   S('p_arr_table2','Шанс выпадения строк','Уровни 1-5 одной строки (от минимума к максимуму): 35% / 21% / 21% / 14% / 9%.'+T([['Строка','Шанс'],['Урон от арретира','1,49%'],['Ко всем видам элементального урона','2,99%'],['К элементальному урону','2,99%'],['Урон базовой атаки/умений, Урон, По боссам, По ослабленным, Крит. урон','по 5,97%'],['Шанс крита, Сноровка, Скорость атаки, Сила/интеллект, Ловкость/сила духа, Здоровье, Сила атаки','по 8,96%']])),
   S(null,'Как перекатывать выгодно','Хорошие строки: урон от арретира, элементальный, урон, по боссам, крит, крит. урон. Мусор - 7 «по 8,96%» строк, они выпадают чаще всего. Есть 2 хорошие - закрой их предохранителями и крути остальные.','s','Без предохранителей крути только арретир, где терять нечего (0-1 хорошая строка).'),

 {id:'fbase',name:'Окно флотилии и казна',who:'Esc → Флотилия',must:['Казна - общий кошелёк, из неё качаются технологии','Каждый день в 6:00 снимается налог за технологии','Технологии открывают товары в магазине флотилии'],
  steps:[S('f_main','Esc → Флотилия → «Описание»','Слева вкладки: Описание, Члены экипажа, <b>Запретная зона, Штурмовые манёвры, Арканитовый лабиринт, Большая охота</b>. Справа уровень флотилии, <b>казна</b> и ежедневный налог. Внизу 4 кнопки: технологии, испытания, журнал, магазин.'),
   S('f_rules','Как пополняется казна','Отметки в журнале, ежедневные задания и задания флотилии, бои в Запретной зоне - всё это пополняет казну. Казна ограничена (предел зависит от уровня флотилии). Каждый день в 6:00 за изученные технологии снимается <b>налог</b>.','w'),
   S('f_tech','Кнопка 1 - Технологии','Технологии качает капитан за казну - рядовому игроку тут делать нечего, но полезно знать: ветка <b>«Полезные мелочи»</b> расширяет ассортимент магазина флотилии (карман, сундук, стандартный катализатор и т. д.). Пока технология не изучена, товар в магазине помечен «Необходимо повысить уровень лавки флотилии».')]},
 {id:'fdaily',name:'Каждый день',who:'кнопка 2 - Испытания',must:['Отметка в журнале - 1-я бесплатно','5-я отметка всегда класса S','Фрагменты - дари до 5 в день'],
  steps:[S('f_checkin','Испытания → «Отметки» (журнал)','Отмечайся каждый день: <b>+15 жетонов флотилии</b> и пополнение казны. Первая отметка бесплатная, следующие - за призмадий (50).'),

 {id:'fzone',name:'Запретная зона',who:'каждый день 12:00, 15:00, 18:00, 21:00 (UTC)',must:['Сервер против сервера, до 28 игроков с каждой стороны','Побеждает тот, кто добьёт Тяжёлый буровой мех','2 минуты без действий = кик и бан на участие'],
  steps:[S('f_zone','Флотилия → Запретная зона','Бой двух серверов, до 30 минут. Награды получают все участники, лучший игрок боя - ещё <b>сундук знатока</b> (до 4 в день). Даёт <b>медали</b>. Справа - «Разработка Запретной зоны»: личная награда (до 300) и награда флотилии.'),
   S(null,'Правила','Команды по 1-4. В боях 12:00 и 14:00 сначала берут игроков с большим <b>рейтингом экипировки</b>; проиграл и вышел - рейтинг в следующем матче считается на 3000 ниже. Захват <b>опорного пункта</b> усиливает весь сервер против меха. Победа в бою 21:00 даёт серверу бафф до 21:00 следующего дня. Упал - тебя могут поднять, иначе место займёт следующий в очереди.','w','Не стой AFK: 2 минуты без действий - вылет без награды и запрет на 30 минут, потом 24 и 48 часов. Счётчик сбрасывается в пн 06:00.')]},

  steps:[S('f_assault','Флотилия → Штурмовые манёвры','Босс-рейд флотилии: соло или группой из своей флотилии. Внизу - <b>общие звёзды</b> флотилии и сундуки за 100 / 200 / 300 / 400 / 500 звёзд. Справа - личный рекорд и награды.'),
   S(null,'Правила','За победу даётся столько звёзд, сколько ранг цели. Последний манёвр - выбери <b>VI или «Особо опасен»</b>: награду за первое прохождение дают только за одну из них. «Особо опасен» меняется каждую неделю, не больше 3 попыток (неудачные не считаются). Награды получает каждый персонаж раз в неделю, но не больше 6 раз на аккаунт.'),

  steps:[S('f_hunt','Флотилия → Большая охота','Общий босс. Его боевая мощь меняется каждую охоту - по итогам прошлой. Чем сильнее цель, тем лучше награды.'),
